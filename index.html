    if (!lastSummaryParts) return;
    var s = t();
    flashStatus(s.statusCreating);
    getShareEntry().then(function(entry){
      if (IS_IOS || IS_INAPP){ flashStatus(""); openSaveSheet(entry); return; }  // 다운로드가 막히는 환경
      downloadBlob(entry.blob, "monga-result.png");
      flashStatus(t().statusSaved);
    }).catch(function(){ flashStatus(t().statusFailed); });
  });

  // ---- 길게 눌러 저장 시트 ----
  var sheetReturnFocus = null;
  function blobToDataUrl(blob){
    return new Promise(function(resolve, reject){
      var fr = new FileReader();
      fr.onload = function(){ resolve(fr.result); };
      fr.onerror = reject;
      fr.readAsDataURL(blob);
    });
  }
  function closeSaveSheet(){
    var el = document.getElementById("save-sheet");
    if (el) el.parentNode.removeChild(el);
    document.removeEventListener("keydown", sheetKey);
    if (sheetReturnFocus && sheetReturnFocus.focus) sheetReturnFocus.focus();
  }
  function sheetKey(e){ if (e.key === "Escape") closeSaveSheet(); }
  function openSaveSheet(entry, offerShare){
    closeSaveSheet();
    var U = shareUI();
    sheetReturnFocus = document.activeElement;
    var wrap = document.createElement("div");
    wrap.id = "save-sheet"; wrap.className = "save-sheet";
    wrap.setAttribute("role", "dialog"); wrap.setAttribute("aria-modal", "true"); wrap.setAttribute("aria-labelledby", "save-sheet-title");
    wrap.innerHTML =
      '<div class="save-sheet-box">' +
        '<div class="save-sheet-title display" id="save-sheet-title">' + esc(U.sheetTitle) + '</div>' +
        '<div class="save-sheet-img"><img alt="' + esc(t().shareTitle) + '"></div>' +
        '<div class="save-sheet-tip">' + esc(IS_IOS ? U.sheetIOS : U.sheetAndroid) + '</div>' +
        (IS_INAPP ? '<div class="save-sheet-tip">' + esc(U.sheetInApp) + '</div>' : '') +
        '<div class="card-actions">' +
          (offerShare ? '<button type="button" class="btn btn-primary" data-sheet="share">' + esc(U.sheetShare) + '</button>' : '') +
          (!IS_INAPP && !IS_IOS ? '<button type="button" class="btn btn-ghost" data-sheet="download">' + esc(U.sheetDownload) + '</button>' : '') +
          '<button type="button" class="btn btn-ghost" data-sheet="close">' + esc(U.sheetClose) + '</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(wrap);
    // 인앱 브라우저는 blob: 주소 이미지를 길게 눌러 저장하지 못하는 경우가 있어 data: 주소로 넣음
    blobToDataUrl(entry.blob).then(function(url){ var im = wrap.querySelector("img"); if (im) im.src = url; })
      .catch(function(){ var im = wrap.querySelector("img"); if (im) im.src = URL.createObjectURL(entry.blob); });
    wrap.addEventListener("click", function(e){
      var b = e.target.closest ? e.target.closest("[data-sheet]") : null;
      if (e.target === wrap){ closeSaveSheet(); return; }
      if (!b) return;
      var act = b.getAttribute("data-sheet");
      if (act === "close") closeSaveSheet();
      else if (act === "download"){ downloadBlob(entry.blob, "monga-result.png"); flashStatus(t().statusSaved); }
      else if (act === "share"){ closeSaveSheet(); shareEntry(entry); }
    });
    document.addEventListener("keydown", sheetKey);
    var first = wrap.querySelector("[data-sheet]");
    if (first) first.focus();
  }

  // ---- 텍스트 복사 (공유 창이 없을 때) ----
  function copyText(text){
    function legacy(){
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
      var ok = false; try { ok = document.execCommand("copy"); } catch(e){}
      document.body.removeChild(ta);
      return ok;
    }
    if (navigator.clipboard && window.isSecureContext){
      return navigator.clipboard.writeText(text).then(function(){ return true; }).catch(function(){ return legacy(); });
    }
    return Promise.resolve(legacy());
  }

  // ================= 화면용 캐릭터 그리기 =================
  function paintChar(canvas, size, typeKey, level){
    if (!canvas) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = size * dpr; canvas.height = size * dpr;
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);
    drawCharacterIcon(ctx, size/2, size*0.53, size*0.28, typeKey, level);
  }

    { id:"ia-s4", types:["IA"], fam:"social", int:3, ko:"말이 많지 않아도 되는 클라이밍·수영 같은 운동을 지인과 함께 해보세요.", en:"Try a low-talk activity like climbing or swimming with someone you know." },
    { id:"ia-r1", types:["IA"], fam:"rest", int:1, ko:"창밖 하늘을 2분간 바라보며 숨을 길게 내쉬어보세요.", en:"Look at the sky for 2 minutes and breathe out slowly." },
    { id:"ia-r2", types:["IA"], fam:"rest", int:2, ko:"몰입되는 다큐멘터리 한 편을 혼자 감상해보세요.", en:"Watch an absorbing documentary on your own." },
    { id:"ia-r3", types:["IA"], fam:"rest", int:2, ko:"혼자 떠나고 싶은 여행지를 지도에서 찾아 계획을 세워보세요.", en:"Find a solo trip spot on the map and sketch a plan." },
    { id:"ia-r4", types:["IA"], fam:"rest", int:3, ko:"처음 가보는 동네를 혼자 골목 산책하며 사진을 찍어보세요.", en:"Explore a new neighborhood alone and take photos as you wander." },

    // 달빛형 (내향·안정): 혼자만의 조용한 시간으로 회복
    { id:"is-m1", types:["IS"], fam:"move", int:1, ko:"누운 채로 손끝과 발끝을 천천히 쥐었다 펴보세요.", en:"Lying down, slowly clench and release your fingers and toes." },
    { id:"is-m2", types:["IS"], fam:"move", int:2, ko:"조용한 요가 영상 하나를 혼자 따라 해보세요.", en:"Follow a quiet yoga video on your own." },
    { id:"is-m3", types:["IS"], fam:"move", int:2, ko:"해 질 무렵 혼자 동네를 천천히 20분 걸어보세요.", en:"Walk slowly around your neighborhood alone at dusk for 20 minutes." },
    { id:"is-m4", types:["IS"], fam:"move", int:3, ko:"사람이 적은 수목원이나 공원에서 1시간 산책해보세요.", en:"Spend an hour walking in a quiet arboretum or park." },
    { id:"is-s1", types:["IS"], fam:"social", int:1, ko:"답장이 부담 없는 사람에게 좋아하는 노래 링크 하나를 보내보세요.", en:"Send a song link to someone who won't expect a long reply." },
    { id:"is-s2", types:["IS"], fam:"social", int:2, ko:"편한 사람 한 명과 짧게 문자로 하루를 나눠보세요.", en:"Share your day by text with one comfortable person." },
    { id:"is-s3", types:["IS"], fam:"social", int:2, ko:"좋아하는 작가나 창작자에게 응원 댓글을 남겨보세요.", en:"Leave an encouraging comment for an author or creator you like." },
    { id:"is-s4", types:["IS"], fam:"social", int:3, ko:"조용한 독서 모임이나 필사 모임에 한 번 참여해보세요.", en:"Join a quiet book club or copying circle once." },
    { id:"is-r1", types:["IS"], fam:"rest", int:1, ko:"따뜻한 물로 손을 씻으며 온기를 느껴보세요.", en:"Wash your hands in warm water and notice the warmth." },
    { id:"is-r2", types:["IS"], fam:"rest", int:2, ko:"좋아하는 향초나 향을 켜고 10분 멍하니 있어보세요.", en:"Light a candle or scent you like and zone out for 10 minutes." },
    { id:"is-r3", types:["IS"], fam:"rest", int:2, ko:"마음에 드는 문장 하나를 손으로 천천히 따라 써보세요.", en:"Slowly copy out a sentence you like by hand." },
    { id:"is-r4", types:["IS"], fam:"rest", int:3, ko:"퍼즐·뜨개질·컬러링처럼 손으로 하는 취미에 30분 몰입해보세요.", en:"Spend 30 minutes absorbed in a hands-on hobby like puzzles, knitting or coloring." }
  ].forEach(function(a){ ACTIVITY_POOL.push(a); });

  var FAMS = ["move", "social", "rest"];
  // 기질(외향-내향 × 활동-안정) 4유형별 계열 가중치 — 높은 계열부터 추천
  var FAM_WEIGHT = {
    EA: { move:3, social:3, rest:1 },
    ES: { social:3, rest:2, move:1 },
    IA: { move:3, rest:2, social:1 },
    IS: { rest:3, move:2, social:1 }
  };
  // 스트레스 신호 수준으로 정하는 활동 강도 상한 (상한 이하 활동만 추천)
  var LEVEL_CAP = { mild:3, moderate:2, severe:1 };

  function famOrder(){
    var w = FAM_WEIGHT[state.typeKey] || FAM_WEIGHT.IS;
    return FAMS.slice().sort(function(a, b){ return w[b] - w[a]; });
  }
  function capNow(){ return LEVEL_CAP[state.level] || 1; }
  function ensurePlan(){
    if (!state) return;
    var cap = capNow();
    if (!state.plan || FAMS.indexOf(state.plan.fam) < 0){
      state.plan = { fam: famOrder()[0], int: Math.min(cap, 2), tries: 0, downs: 0 };
    }
    state.plan.int = Math.max(1, Math.min(state.plan.int, cap));
  }
  function actById(id){
    for (var i = 0; i < ACTIVITY_POOL.length; i++) if (ACTIVITY_POOL[i].id === id) return ACTIVITY_POOL[i];
    return null;
  }
  function dayNum(){ var d = new Date(); d.setHours(0,0,0,0); return Math.floor(d.getTime() / 86400000); }
  // 공통 활동 + 내 기질 유형 전용 활동만
  function fitsType(a){ return !a.types || a.types.indexOf(state.typeKey) >= 0; }
  // ---- 활동 기록(actLog): 체크(했어요/못 했어요)와 "다른 추천 받기"를 모두 시간순으로 저장 ----
  // 예전 버전의 날짜별 checkins를 처음 한 번 actLog로 옮김
  function ensureActLog(){
    if (!state.actLog){
      state.actLog = Object.keys(state.checkins || {}).sort().map(function(k){
        var c = state.checkins[k] || {};
        return { id: c.id, fam: c.fam, int: c.int, done: c.done !== false, effect: c.effect, reason: c.reason, next: c.next,
                 ts: c.ts || dateFromKey(k).getTime(), day: k, wk: weekKey(dateFromKey(k)), kind: "check" };
      }).filter(function(e){ return e.id; });
    }
    return state.actLog;
  }
  function checksOnly(){ return ensureActLog().filter(function(e){ return e.kind === "check"; }); }
  // 주 단위 키 = 그 주 월요일 날짜
  function weekKey(d){ var x = new Date(d); x.setHours(0,0,0,0); var wd = (x.getDay() + 6) % 7; x.setDate(x.getDate() - wd); return dayKey(x); }
  // 최근에 추천·체크한 활동 ID (같은 활동이 너무 자주 반복되지 않게)
  function recentActIds(n){
    var ids = ensureActLog().slice(-n).map(function(e){ return e.id; });
    if (state.lastActId) ids.push(state.lastActId);
    return ids;
  }

  // ---- 참여자 데이터로 학습한 추천 점수 (Apps Script가 집계해 내려주는 모델) ----
  // 유형별·활동별로 n(추천에 반응한 횟수), done(수행), down(수행 후 스트레스 감소), rej(다른 추천 요청·마음에 안 듦)
  var MODEL = null;
  try { MODEL = JSON.parse(localStorage.getItem("monga_model") || "null"); } catch(e){ MODEL = null; }
  function mergeModelActivities(){
    if (!MODEL || !MODEL.activities) return;
    MODEL.activities.forEach(function(a){
      if (!a || !a.id || !a.ko || FAMS.indexOf(a.fam) < 0 || actById(a.id)) return;
      ACTIVITY_POOL.push({ id: String(a.id), types: (a.types && a.types.length) ? a.types : undefined, fam: a.fam,
        int: Math.max(1, Math.min(3, +a.int || 1)), ko: String(a.ko), en: String(a.en || a.ko), community: true });
    });
  }
  function fetchModel(){
    if (!SHEET_WEBHOOK_URL || SHEET_WEBHOOK_URL.indexOf("여기에_") === 0) return;
    // 개인 정보는 보내지 않고, 전체 참여자의 집계 결과만 받아옴
    fetch(SHEET_WEBHOOK_URL + "?action=model").then(function(r){ return r.json(); }).then(function(m){
      if (!m || !m.stats) return;
      MODEL = m;
      try { localStorage.setItem("monga_model", JSON.stringify(m)); } catch(e){}
      mergeModelActivities();
      var actScreen = document.getElementById("screen-activity");
      if (state && actScreen && !actScreen.hidden && !actPending) renderActivity();
    }).catch(function(){ /* 오프라인이면 마지막으로 받은 모델 사용 */ });
  }
  // 점수 = 효과(수행 후 스트레스 감소 비율) 60% + 수용도(추천을 실제로 해본 비율) 40%, 기록이 적은 새 활동은 탐색 가산점
  function communityScore(a){
    var st = MODEL && MODEL.stats && MODEL.stats[state.typeKey] && MODEL.stats[state.typeKey][a.id];
    var n = st ? st.n : 0, done = st ? st.done : 0, down = st ? st.down : 0;
    var eff = (down + 1) / (done + 2);
    var acc = (done + 1) / (n + 2);
    return 0.6 * eff + 0.4 * acc + (n < 5 ? 0.15 : 0);
  }
  function seeded(str){ var h = 2166136261; for (var i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 100000) / 100000; }
  function pickWeighted(list, seed){
    var w = list.map(communityScore), total = w.reduce(function(a, b){ return a + b; }, 0);
    var r = seeded(seed) * total;
    for (var i = 0; i < list.length; i++){ r -= w[i]; if (r <= 0) return list[i]; }
    return list[list.length - 1];
  }
  function candidates(fam, maxInt, exclude){
    var pool = ACTIVITY_POOL.filter(fitsType);
    var exact = pool.filter(function(a){ return a.fam === fam && a.int === maxInt; });
    var list = exact.length ? exact : pool.filter(function(a){ return a.fam === fam && a.int <= maxInt; });
    var rest = list.filter(function(a){ return exclude.indexOf(a.id) < 0; });
    return rest.length ? rest : list;
  }
  // ---- 이번 주 추천 활동 ----
  // state.weekAct = { wk, id, swaps, rejected:[ids], checked }
  function weekActivity(){
    var wk = weekKey(new Date());
    var w = state.weekAct;
    if (w && w.wk === wk && actById(w.id)) return actById(w.id);
    ensurePlan();
    var list = candidates(state.plan.fam, state.plan.int, recentActIds(6));
    var a = pickWeighted(list, UID + wk);
    state.weekAct = { wk: wk, id: a.id, swaps: 0, rejected: [], checked: false };
    saveState();
    return a;
  }
  // 같은 주 안에서 다음 활동 고르기 (다른 추천 받기, 또는 체크 후 하나 더)
  function nextWeekActivity(cur){
    var wk = weekKey(new Date());
    var w = state.weekAct && state.weekAct.wk === wk ? state.weekAct : { rejected: [], swaps: 0 };
    var excl = (w.rejected || []).concat([cur.id]).concat(recentActIds(6));
    ensurePlan();
    var order = famOrder();
    var fams = [state.plan.fam].concat(order.filter(function(f){ return f !== state.plan.fam; }));
    var list = [];
    for (var i = 0; i < fams.length && !list.length; i++){
      list = candidates(fams[i], state.plan.int, excl).filter(function(x){ return excl.indexOf(x.id) < 0; });
    }
    if (!list.length) list = candidates(state.plan.fam, state.plan.int, [cur.id]);
    var swaps = (w.swaps || 0) + 1;
    var a = pickWeighted(list, UID + wk + "#" + swaps);
    state.weekAct = { wk: wk, id: a.id, swaps: swaps, rejected: (w.rejected || []).concat([cur.id]), checked: false };
    saveState();
    return a;
  }
  // "다른 추천 받기": 거절 기록을 남기고, 같은 계열에서 2번 연속 거절하면 계열을 바꿈
  function rejectActivity(cur){
    var log = ensureActLog();
    var wk = weekKey(new Date());
    var e = { id: cur.id, fam: cur.fam, int: cur.int, done: null, ts: Date.now(), day: dayKey(new Date()), wk: wk, kind: "reject" };
    log.push(e);
    ensurePlan();
    var sameFamRejects = log.filter(function(x){ return x.kind === "reject" && x.wk === wk && x.fam === state.plan.fam; }).length;
    if (sameFamRejects >= 2){
      var order = famOrder();
      state.plan.fam = order[(order.indexOf(state.plan.fam) + 1) % order.length];
      state.plan.tries = 0;
    }
    sendCheckinToSheet(e, e.day);
    return nextWeekActivity(cur);
  }

  // ---- 체크인 결과 3갈래 규칙 (다음 날 추천에 반영) ----
  //  미수행            → 효과 판단에서 제외, 같은 계열에서 강도 한 단계 낮춤
  //  수행 + 스트레스 감소 → 같은 계열 유지(다른 활동)
  //  수행 + 변화 없음/증가 → 같은 계열에서 2회 쌓이면 다음 계열로 전환 (증가면 강도도 낮춤)
  // 한 번의 결과로 단정하지 않도록(자연 회복·회귀평균) 전환은 2회 누적 후에만 함.
  function applyCheckin(c){
    ensurePlan();
    var p = state.plan, next;
    if (p.fam !== c.fam){ p.fam = c.fam; p.tries = 0; p.downs = 0; } // 사용자가 바꾼 활동의 계열을 기준으로
    if (!c.done && c.reason === "dislike"){
      // 마음에 안 든 경우: 강도는 그대로, 다른 활동으로. 같은 계열에서 2번이면 계열 전환
      p.downs = 0; p.tries = (p.tries || 0) + 1; p.int = c.int;
      if (p.tries >= 2){
        var o2 = famOrder();
        p.fam = o2[(o2.indexOf(p.fam) + 1) % o2.length];
        p.tries = 0; next = "switchTo";
      } else { next = "other"; }
    } else if (!c.done){
      next = c.int <= 1 ? "easy" : "lower";
      p.int = Math.max(1, c.int - 1); p.downs = 0;
    } else if (c.effect === "down"){
      // 같은 계열에서 연속 2번 줄었으면 상한 안에서 강도를 한 단계 올려봄
      p.tries = 0; p.downs = (p.downs || 0) + 1; p.int = c.int;
      if (p.downs >= 2 && p.int < capNow()){ p.int++; p.downs = 0; }
      next = "keep";
    } else {
      p.downs = 0;
      p.tries = (p.tries || 0) + 1;
      p.int = c.effect === "up" ? Math.max(1, c.int - 1) : c.int;
      if (p.tries >= 2){
        var order = famOrder();
        p.fam = order[(order.indexOf(p.fam) + 1) % order.length];
        p.tries = 0; next = "switchTo";
      } else {
        next = (c.effect === "up" && c.int > 1) ? "lower" : "retry";
      }
    }
    p.int = Math.max(1, Math.min(p.int, capNow()));
    state.lastActId = c.id;
    return next;
  }

  // 기록한 날 = 일기를 썼거나 활동을 체크한 날
  function recordedOn(k){
    if ((state.journal || {})[k]) return true;
    return checksOnly().some(function(e){ return e.day === k; });
  }
  function streakCount(){
    var d = new Date(), n = 0;
    if (!recordedOn(dayKey(d))) d = addDays(d, -1);
    while (recordedOn(dayKey(d))){ n++; d = addDays(d, -1); }
    return n;
  }
  function fitStats(){
    var st = { move:{n:0,d:0}, social:{n:0,d:0}, rest:{n:0,d:0} };
    checksOnly().forEach(function(c){
      if (c.done && st[c.fam]){ st[c.fam].n++; if (c.effect === "down") st[c.fam].d++; }
    });
    return st;
  }
  function crisisHtml(s){
    return '<div class="crisis"><div class="crisis-title">' + esc(s.crisisTitle) + '</div>' +
      '<div class="crisis-desc">' + esc(s.crisisDesc) + '</div><div class="crisis-lines">' +
      s.crisisLines.map(function(l){ return '<a href="tel:' + l[1].replace(/-/g, "") + '"><span>' + esc(l[0]) + '</span><b>' + esc(l[1]) + '</b></a>'; }).join("") +
      '</div></div>';
  }

  function finishWeekly(){
    var sum = 0;
    activeQs.forEach(function(q, i){ sum += q.reverse ? (6 - answers[i]) : answers[i]; });
    var score = sum * 2; // 4문항(4~20점)을 8문항 기준(8~40점)으로 환산
    var level = score <= 18 ? "mild" : (score <= 29 ? "moderate" : "severe");
    state.level = level; state.burnoutSum = score;
    state.history.push({ ts: Date.now(), score: score, level: level, kind: "weekly" });
    if (state.history.length > 24) state.history = state.history.slice(-24);
    if (state.weekAct && !state.weekAct.checked) state.weekAct = null; // 새 상한에 맞춰 이번 주 활동 다시 고름
    ensurePlan();
    state.weeklyMsg = { score: score, level: level };
    saveState();
    var sheet = new Array(questions.length).fill("");
    WEEKLY_IDX.forEach(function(qi, i){ sheet[qi] = answers[i]; });
    lastSummaryParts = { burnoutSum: score, level: level, typeKey: state.typeKey, sheetAnswers: sheet };
    scheduleAutoSave();
    renderHome();
    showScreen(elHome);
  }

  // ================= 감정 회복 일기 =================
  // 일기는 매우 민감한 정보라 이 기기(localStorage)에만 저장하고, 동의 여부와 상관없이 시트로 보내지 않음
  var elJournal = document.getElementById("screen-journal");
  var diaryDraft = { emo: null, text: "", editing: false };

  function startDayKey(){
    if (!state.startDay){
      var first = state.history.length ? new Date(state.history[0].ts) : new Date();
      state.startDay = dayKey(first);
    }
    return state.startDay;
  }
  function dateFromKey(k){ var p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  // 회복 n일차 = 첫 체크한 날을 1일차로 센 날짜
  function recoveryDay(k){
    return Math.max(1, Math.round((dateFromKey(k) - dateFromKey(startDayKey())) / 86400000) + 1);
  }
  function emoInfo(s, key){
    for (var i = 0; i < s.emos.length; i++) if (s.emos[i][0] === key) return s.emos[i];
    return null;
  }
  function fmtDate(k){ var d = dateFromKey(k); return (d.getMonth()+1) + "/" + d.getDate() + " (" + t().weekdays[d.getDay()] + ")"; }
  function actLine(s, k){
    return checksOnly().filter(function(e){ return e.day === k; }).map(function(c){
      var a = actById(c.id);
      if (c.done === false) return s.actSkipped + (a ? " · " + a[LANG] : "");
      if (!a) return "";
      return s.fam[a.fam] + " · " + a[LANG] + (c.effect ? " · " + s.effArrow[c.effect] : "");
    }).filter(Boolean).join(" / ");
  }
  function entryHtml(s, k){
    var j = (state.journal || {})[k];
    var e = j ? emoInfo(s, j.emo) : null;
    var al = actLine(s, k);
    return '<div class="entry"><div class="entry-head"><span class="entry-day">' + esc(s.diaryDay(recoveryDay(k))) + '</span><span>' + esc(fmtDate(k)) + '</span></div>' +
      (e ? '<div class="entry-emo">' + e[1] + ' ' + esc(e[2]) + '</div>' : '') +
      (j && j.text ? '<div class="entry-text">' + esc(j.text) + '</div>' : '') +
      (al ? '<div class="entry-act">🌱 ' + esc(al) + '</div>' : '') + '</div>';
  }
  // 일기나 체크인이 있는 날짜, 최신순
  function recordDays(){
    var keys = {};
    Object.keys(state.journal || {}).forEach(function(k){ keys[k] = 1; });
    checksOnly().forEach(function(e){ keys[e.day] = 1; });
    return Object.keys(keys).sort().reverse();
  }

  function diaryCardHtml(s, tk){
    state.journal = state.journal || {};
    var j = state.journal[tk];
    var h = '<div class="card" id="diary-card"><div class="card-eyebrow"><span>' + esc(s.diaryTitle) + '</span><span style="color:var(--green-deep);">' +
      esc(s.diaryDay(recoveryDay(tk))) + '</span></div>';
    if (j && !diaryDraft.editing){
      var e = emoInfo(s, j.emo);
      h += '<div class="card-title" style="font-size:17px;">' + esc(s.diarySaved) + '</div>' +
        '<div class="entry-emo">' + (e ? e[1] + ' ' + esc(e[2]) : '') + '</div>' +
        (j.text ? '<div class="entry-text">' + esc(j.text) + '</div>' : '') +
        '<div style="margin-top:8px;"><button type="button" class="link-btn" id="d-edit">' + esc(s.diaryEdit) + '</button></div>';
    } else {
      if (diaryDraft.editing && j && diaryDraft.emo === null){ diaryDraft.emo = j.emo; diaryDraft.text = j.text || ""; }
      h += '<div class="mood-q" style="margin-top:8px;">' + esc(s.diaryQ) + '</div><div class="emo-grid">';
      s.emos.forEach(function(em){
        h += '<button type="button" class="emo" data-emo="' + em[0] + '" aria-pressed="' + (diaryDraft.emo === em[0]) + '"><b>' + em[1] + '</b>' + esc(em[2]) + '</button>';
      });
      h += '</div><textarea class="diary-text" id="d-text" maxlength="500" placeholder="' + esc(s.diaryPh) + '">' + esc(diaryDraft.text) + '</textarea>' +
        '<div class="card-actions"><button type="button" class="btn btn-primary" id="d-save"' + (diaryDraft.emo ? '' : ' disabled') + '>' + esc(s.diarySave) + '</button></div>';
    }
    var past = recordDays().filter(function(k){ return k !== tk; }).slice(0, 2);
    if (past.length){
      h += '<div style="margin-top:12px;">';
      past.forEach(function(k){ h += entryHtml(s, k); });
      h += '</div>';
    }
    h += '<div style="margin-top:10px;"><button type="button" class="link-btn" id="d-all">' + esc(s.diaryAll(recordDays().length)) + '</button></div>' +
      '<div class="cap-row">🔒 ' + esc(s.diaryPrivacy) + '</div></div>';
    return h;
  }

  function wireDiary(box, s, tk){
    Array.prototype.forEach.call(box.querySelectorAll(".emo"), function(b){
      b.addEventListener("click", function(){
        diaryDraft.emo = b.getAttribute("data-emo");
        Array.prototype.forEach.call(box.querySelectorAll(".emo"), function(x){ x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
        var sv = document.getElementById("d-save");
        if (sv) sv.disabled = false;
      });
    });
    var ta = document.getElementById("d-text");
    if (ta) ta.addEventListener("input", function(){ diaryDraft.text = ta.value; });
    var sv = document.getElementById("d-save");
    if (sv) sv.addEventListener("click", function(){
      if (!diaryDraft.emo) return;
      state.journal[tk] = { emo: diaryDraft.emo, text: (diaryDraft.text || "").trim().slice(0, 500), ts: Date.now() };
      diaryDraft = { emo: null, text: "", editing: false };
      // 오늘 활동이 '감정 적기'이고 아직 체크인 전이면, 일기를 쓴 것으로 바로 효과 질문으로 이어감
      // 이번 주 활동이 '감정 적기'이고 아직 체크 전이면, 일기를 쓴 것으로 회복 활동 화면의 효과 질문으로 이어감
      if (state.weekAct && !state.weekAct.checked && state.weekAct.id === "r2b" && state.journal[tk].text){
        saveState(); actPending = "done"; renderActivity(); showScreen(document.getElementById("screen-activity")); return;
      }
      saveState();
      renderHome();
    });
    var ed = document.getElementById("d-edit");
    if (ed) ed.addEventListener("click", function(){ diaryDraft = { emo: null, text: "", editing: true }; renderHome(); });
    document.getElementById("d-all").addEventListener("click", function(){ renderJournal(); showScreen(elJournal); });
  }

  function renderJournal(){
    if (!state) return;
    var s = t();
    state.journal = state.journal || {};
    document.getElementById("journal-back").textContent = s.journalBack;
    document.getElementById("journal-title").textContent = s.journalTitle;
    var tk = dayKey(new Date());
    var days = recordDays();
    var nEntries = Object.keys(state.journal).length;
    var h = '<div class="card"><div class="card-title" style="margin-top:0;">' + esc(s.journalSummary(recoveryDay(tk), nEntries)) + '</div>' +
      '<div class="card-eyebrow" style="margin-top:12px;"><span>' + esc(s.flowTitle) + '</span></div><div class="flow">';
    for (var i = 6; i >= 0; i--){
      var d = addDays(new Date(), -i);
      var j = state.journal[dayKey(d)];
      var e = j ? emoInfo(s, j.emo) : null;
      h += '<div>' + s.weekdays[d.getDay()] + '<span>' + (e ? e[1] : '·') + '</span></div>';
    }
    h += '</div>';
    if (nEntries){
      var cnt = {};
      Object.keys(state.journal).forEach(function(k){ var em = state.journal[k].emo; cnt[em] = (cnt[em] || 0) + 1; });
      var max = Math.max.apply(null, Object.keys(cnt).map(function(k){ return cnt[k]; }));
      h += '<div class="card-eyebrow" style="margin-top:14px;"><span>' + esc(s.distTitle) + '</span></div>';
      s.emos.filter(function(em){ return cnt[em[0]]; })
        .sort(function(a, b){ return cnt[b[0]] - cnt[a[0]]; })
        .forEach(function(em){
          h += '<div class="fit-row"><span class="fit-name" style="width:auto;min-width:92px;">' + em[1] + ' ' + esc(em[2]) + '</span>' +
            '<div class="fit-track"><div class="fit-fill" style="width:' + Math.round(cnt[em[0]] / max * 100) + '%"></div></div>' +
            '<span class="fit-num" style="min-width:24px;">' + cnt[em[0]] + '</span></div>';
        });
    }
    h += '</div><div class="card"><div class="card-eyebrow"><span>' + esc(s.entriesTitle) + '</span></div>';
    if (days.length){ days.forEach(function(k){ h += entryHtml(s, k); }); }
    else { h += '<div class="card-desc" style="margin-top:8px;">' + esc(s.journalEmpty) + '</div>'; }
    h += '</div><div class="card-actions" style="margin-bottom:8px;"><button type="button" class="btn btn-ghost" id="j-export">' + esc(s.exportBtn) + '</button></div>' +
      '<div class="cap-row" style="margin-bottom:16px;">🔒 ' + esc(s.diaryPrivacy) + '</div>';
    document.getElementById("journal-body").innerHTML = h;
    document.getElementById("j-export").addEventListener("click", exportRecords);
  }

  // 내 기록을 텍스트 파일로 내려받기 (데이터는 사용자 것)
  function exportRecords(){
    var s = t();
    state.journal = state.journal || {};
    var lines = [s.journalTitle + " — Monga", ""];
    lines.push("■ " + s.historyTitle);
    state.history.forEach(function(h){
      lines.push("- " + dayKey(new Date(h.ts)) + (h.kind === "weekly" ? " (weekly)" : "") + " · " + h.score + "/40 · " + s.burnoutLabel[h.level]);
    });
    lines.push("", "■ " + s.entriesTitle);
    recordDays().slice().reverse().forEach(function(k){
      var j = state.journal[k];
      var e = j ? emoInfo(s, j.emo) : null;
      var al = actLine(s, k);
      lines.push("[" + s.diaryDay(recoveryDay(k)) + "] " + k + (e ? " · " + e[2] : ""));
      if (j && j.text) lines.push(j.text);
      if (al) lines.push("· " + al);
      lines.push("");
    });
    lines.push(s.disclaimer);
    downloadBlob(new Blob(["﻿" + lines.join("\n")], { type: "text/plain;charset=utf-8" }), "monga-records-" + dayKey(new Date()) + ".txt");
  }

  document.getElementById("journal-back").addEventListener("click", function(){ renderHome(); showScreen(elHome); });

  // ================= 하단 탭 (일기 / 회복 활동) =================
  var elActivity = document.getElementById("screen-activity");
  var actPending = null;      // null | "done" | "skip" — 이번 주 활동 체크 중
  var prevPending = null;     // null | "done" | "skip" — 지난주 활동 체크 중
  var suggDraft = { text: "", fam: null, int: null };
  var suggStatus = "";

  function goTab(tab){
    if (tab === "activity"){ renderActivity(); showScreen(elActivity); }
    else { renderHome(); showScreen(elHome); }
  }
  Array.prototype.forEach.call(document.querySelectorAll(".tabbar .tab"), function(b){
    b.addEventListener("click", function(){ goTab(b.getAttribute("data-tab")); });
  });
  // 지난주 활동을 아직 체크하지 않았는지
  function prevWeekUnchecked(){
    var w = state && state.weekAct;
    return !!(w && w.wk !== weekKey(new Date()) && !w.checked && actById(w.id));
  }
  function updateTabs(){
    var s = t();
    Array.prototype.forEach.call(document.querySelectorAll(".tab-diary"), function(x){ x.textContent = s.tabDiary; });
    Array.prototype.forEach.call(document.querySelectorAll(".tab-act"), function(x){ x.textContent = s.tabAct; });
    var cur = state && state.weekAct && state.weekAct.wk === weekKey(new Date()) ? state.weekAct : null;
    var needs = state && (prevWeekUnchecked() || !cur || !cur.checked);
    Array.prototype.forEach.call(document.querySelectorAll(".tab-dot"), function(x){ x.hidden = !needs; });
  }

  // 체크 결과를 기록하고 다음 추천 규칙에 반영
  function recordCheck(a, done, val, wk){
    var c = { id: a.id, fam: a.fam, int: a.int, done: done, ts: Date.now(), day: dayKey(new Date()), wk: wk, kind: "check" };
    if (done) c.effect = val; else c.reason = val;
    c.next = applyCheckin(c);
    ensureActLog().push(c);
    sendCheckinToSheet(c, c.day);
    return c;
  }
  function planNoteText(s, next){
    if (!next) return "";
    return next === "easy" ? s.planNote.easy : s.planNote[next](s.fam[state.plan.fam]);
  }
  function optButtons(s, step){
    var opts = step === "done" ? s.effects : s.reasons;
    return '<div class="mood-q">' + esc(step === "done" ? s.effectQ : s.reasonQ) + '</div><div class="opt-row' + (opts.length === 4 ? ' two' : '') + '">' +
      opts.map(function(o){ return '<button type="button" class="mood" data-val="' + o[2] + '"><b>' + o[0] + '</b>' + esc(o[1]) + '</button>'; }).join("") + '</div>';
  }
  function actTag(s, a){
    return '<span class="mission-tag">' + esc(s.fam[a.fam] + " · " + s.intName[a.int]) + '</span>' + (a.community ? '<span class="community-tag">' + esc(s.communityTag) + '</span>' : '');
  }
  function weekLabelOf(s, wk){ var d = dateFromKey(wk); return s.weekLabel(d.getMonth() + 1, d.getDate()); }

  function renderActivity(){
    if (!state) return;
    ensurePlan(); ensureActLog();
    var s = t();
    var wk = weekKey(new Date());
    document.getElementById("act-title").textContent = s.actTitle;
    document.getElementById("act-sub").textContent = s.actSub;
    var html = "";
    if (state.level === "severe") html += crisisHtml(s);

    // 1) 지난주 활동 결과부터 확인
    if (prevWeekUnchecked()){
      var pa = actById(state.weekAct.id);
      html += '<div class="card"><div class="card-eyebrow"><span>' + esc(s.prevTitle) + '</span><span>' + esc(weekLabelOf(s, state.weekAct.wk)) + '</span></div>' +
        '<div class="card-title">' + esc(pa[LANG]) + '</div><div class="card-desc">' + esc(s.prevDesc) + '</div>';
      html += prevPending ? optButtons(s, prevPending)
        : '<div class="card-actions"><button type="button" class="btn btn-primary" id="p-done">' + esc(s.missionDoneBtn) + '</button>' +
          '<button type="button" class="btn btn-ghost" id="p-skip" style="flex:0 0 auto;">' + esc(s.missionSkipBtn) + '</button></div>';
      html += '</div>';
    } else {
      // 2) 이번 주 추천 활동
      var a = weekActivity();
      var w = state.weekAct;
      var lastCheck = checksOnly().filter(function(e){ return e.wk === wk; }).slice(-1)[0];
      html += '<div class="card' + (w.checked && lastCheck && lastCheck.done ? ' done-card' : '') + '">' +
        '<div class="card-eyebrow"><span>' + esc(s.weekEyebrow) + ' · ' + esc(weekLabelOf(s, wk)) + '</span>' + actTag(s, a) + '</div>';
      if (w.checked && lastCheck){
        html += '<div class="card-title">' + esc(lastCheck.done ? s.weekDoneTitle : s.weekSkipTitle) + '</div>' +
          '<div class="card-desc">' + esc(a[LANG]) + '</div>' +
          (lastCheck.next ? '<div class="plan-note"><i>🌱</i><span>' + esc(planNoteText(s, lastCheck.next)) + '</span></div>' : '') +
          '<div class="card-actions"><button type="button" class="btn btn-ghost" id="w-more">' + esc(s.moreBtn) + '</button></div>' +
          '<div class="cap-row">' + esc(s.nextWeekNote) + '</div>';
      } else {
        if (w.lastNote) html += '<div class="plan-note" style="margin:8px 0 2px;"><i>🌱</i><span>' + esc(planNoteText(s, w.lastNote)) + '</span></div>';
        html += '<div class="card-title">' + esc(a[LANG]) + '</div>';
        if (actPending){
          html += optButtons(s, actPending);
        } else {
          var writeAct = a.id === "r2b" && !((state.journal || {})[dayKey(new Date())] && state.journal[dayKey(new Date())].text);
          html += '<div class="card-actions">' +
            (writeAct ? '<button type="button" class="btn btn-primary" id="w-write">' + esc(s.diaryWriteBtn) + '</button>'
                      : '<button type="button" class="btn btn-primary" id="w-done">' + esc(s.weekDoneBtn) + '</button>') +
            '<button type="button" class="btn btn-ghost" id="w-skip" style="flex:0 0 auto;">' + esc(s.missionSkipBtn) + '</button></div>' +
            '<div style="margin-top:10px;"><button type="button" class="link-btn" id="w-another">' + esc(s.anotherBtn) + '</button></div>';
        }
        html += '<div class="cap-row">' + esc(s.capNote(s.burnoutLabel[state.level], s.intName[capNow()])) + '</div>';
      }
      html += '</div>';
    }

    // 3) 나에게 잘 맞는 활동 (내 기록)
    var fs = fitStats();
    var doneTotal = fs.move.n + fs.social.n + fs.rest.n;
    html += '<div class="card"><div class="card-eyebrow"><span>' + esc(s.fitTitle) + '</span></div>';
    if (doneTotal < 2){
      html += '<div class="card-desc" style="margin-top:8px;">' + esc(s.fitEmpty) + '</div>';
    } else {
      var best = null;
      famOrder().forEach(function(f){
        var r = fs[f];
        html += '<div class="fit-row"><span class="fit-name">' + esc(s.fam[f]) + '</span><div class="fit-track"><div class="fit-fill" style="width:' +
          (r.n ? Math.round(r.d / r.n * 100) : 0) + '%"></div></div><span class="fit-num">' + (r.n ? esc(s.fitNum(r.d, r.n)) : "–") + '</span></div>';
        if (r.n >= 2 && r.d > 0 && (!best || r.d / r.n > fs[best].d / fs[best].n)) best = f;
      });
      if (best) html += '<div class="delta">' + esc(s.fitBest(s.fam[best])) + '</div>';
      html += '<div class="cap-row">' + esc(s.fitCaveat) + '</div>';
    }
    // 참여자 데이터 반영 상태
    html += '<div class="cap-row">🤝 ' + esc(MODEL && MODEL.total ? s.communityNote(MODEL.total, String(MODEL.updated || "").slice(0, 10)) : s.communityNone) + '</div></div>';

    // 4) 하고 싶은 활동 제안하기
    html += '<div class="card"><div class="card-eyebrow"><span>' + esc(s.suggestTitle) + '</span></div>' +
      '<div class="card-desc" style="margin-top:6px;">' + esc(s.suggestDesc) + '</div>' +
      '<textarea class="diary-text" id="s-text" maxlength="80" style="min-height:56px;" placeholder="' + esc(s.suggestPh) + '">' + esc(suggDraft.text) + '</textarea>' +
      '<div class="mood-q">' + esc(s.suggestFam) + '</div><div class="chips">' +
      FAMS.map(function(f){ return '<button type="button" class="chip" data-sfam="' + f + '" aria-pressed="' + (suggDraft.fam === f) + '">' + esc(s.fam[f]) + '</button>'; }).join("") +
      '</div><div class="mood-q">' + esc(s.suggestInt) + '</div><div class="chips">' +
      [1, 2, 3].map(function(i){ return '<button type="button" class="chip" data-sint="' + i + '" aria-pressed="' + (suggDraft.int === i) + '">' + esc(s.intName[i]) + '</button>'; }).join("") +
      '</div><div class="cap-row">' + esc(s.suggestNoPII) + '</div>' +
      '<div class="card-actions"><button type="button" class="btn btn-primary" id="s-send">' + esc(CONSENT ? s.suggestSend : s.suggestSendConsent) + '</button></div>' +
      (suggStatus ? '<div class="delta" aria-live="polite">' + esc(suggStatus) + '</div>' : '');
    var mine = state.suggestions || [];
    if (mine.length){
      html += '<div class="mood-q">' + esc(s.suggestMine) + '</div><div>' + mine.slice(-5).reverse().map(function(m){
        return '<div class="sugg"><span>' + esc(m.text) + ' · ' + esc(s.fam[m.fam]) + '</span><em>' + esc(s.suggestPending) + '</em></div>';
      }).join("") + '</div>';
    }
    html += '</div>';

    var box = document.getElementById("act-cards");
    box.innerHTML = html;
    updateTabs();

    // ---- 이벤트 ----
    var bind = function(id, fn){ var el = document.getElementById(id); if (el) el.addEventListener("click", fn); };
    bind("p-done", function(){ prevPending = "done"; renderActivity(); });
    bind("p-skip", function(){ prevPending = "skip"; renderActivity(); });
    bind("w-done", function(){ actPending = "done"; renderActivity(); });
    bind("w-skip", function(){ actPending = "skip"; renderActivity(); });
    bind("w-another", function(){ rejectActivity(weekActivity()); saveState(); renderActivity(); });
    bind("w-more", function(){ nextWeekActivity(weekActivity()); renderActivity(); });
    bind("w-write", function(){
      goTab("home");
      if (!document.getElementById("d-text")){ diaryDraft = { emo: null, text: "", editing: true }; renderHome(); }
      var ta = document.getElementById("d-text");
      if (ta){ ta.scrollIntoView({ behavior: "smooth", block: "center" }); ta.focus(); }
    });
    Array.prototype.forEach.call(box.querySelectorAll(".mood"), function(btn){
      btn.addEventListener("click", function(){
        var val = btn.getAttribute("data-val");
        if (prevPending){
          // 지난주 활동 결과 → 기록 후 이번 주 새 활동
          recordCheck(actById(state.weekAct.id), prevPending === "done", val, state.weekAct.wk);
          state.weekAct.checked = true; prevPending = null;
        } else if (actPending){
          var a = weekActivity();
          var done = actPending === "done";
          var c = recordCheck(a, done, val, weekKey(new Date()));
          actPending = null;
          if (done){
            state.weekAct.checked = true;
          } else {
            // 못 했으면 이유를 반영해 같은 주 안에서 바로 다른 활동을 추천
            nextWeekActivity(a);
            state.weekAct.lastNote = c.next;
          }
        }
        saveState(); renderActivity();
        var first = box.querySelector(".card:not(.crisis)"); if (first) first.classList.add("pop");
      });
    });
    var st = document.getElementById("s-text");
    if (st) st.addEventListener("input", function(){ suggDraft.text = st.value; });
    Array.prototype.forEach.call(box.querySelectorAll("[data-sfam]"), function(b){
      b.addEventListener("click", function(){ suggDraft.fam = b.getAttribute("data-sfam"); renderActivity(); });
    });
    Array.prototype.forEach.call(box.querySelectorAll("[data-sint]"), function(b){
      b.addEventListener("click", function(){ suggDraft.int = +b.getAttribute("data-sint"); renderActivity(); });
    });
    bind("s-send", function(){
      var text = (suggDraft.text || "").trim();
      if (text.length < 4 || !suggDraft.fam || !suggDraft.int){ suggStatus = s.suggestPh; renderActivity(); return; }
      if (!CONSENT){
        if (!window.confirm(s.suggestConsentConfirm)) return;
        setConsent(true);
      }
      sendSuggestion(text, suggDraft.fam, suggDraft.int);
      state.suggestions = (state.suggestions || []).concat([{ text: text, fam: suggDraft.fam, int: suggDraft.int, ts: Date.now() }]);
      suggDraft = { text: "", fam: null, int: null };
      suggStatus = s.suggestSent;
      saveState(); renderActivity();
    });
  }

  // 사용자가 제안한 활동 → 시트 "활동제안" 탭 (운영자가 승인하면 모델을 통해 추천 목록에 추가됨)
  function sendSuggestion(text, fam, intensity){
    if (!SHEET_WEBHOOK_URL || SHEET_WEBHOOK_URL.indexOf("여기에_") === 0) return;
    if (!CONSENT) return;
    var body = new URLSearchParams();
    body.append("payload", JSON.stringify({ kind: "suggest", uid: UID, typeKey: state.typeKey, fam: fam, intensity: intensity,
      text: text, lang: LANG, consentAt: CONSENT_AT }));
    fetch(SHEET_WEBHOOK_URL, { method: "POST", mode: "no-cors", body: body }).catch(function(){});
  }

  // ================= 몽가의 방 꾸미기 =================
  // 일기나 회복 활동을 기록한 날(연속이 아니어도 됨)이 ROOM_EVERY일 모일 때마다 아이템 1개를 고를 수 있음.
  // 매번 아직 없는 아이템 중 3개를 보여주고 그중 하나를 고름. 자리(slot)마다 하나씩 방에 놓이고,
  // 같은 자리의 아이템을 여러 개 모으면 '내 아이템'에서 눌러 바꿔 놓을 수 있음. 이 기기에만 저장.
  var ROOM_EVERY = 5;
  var ROOM_ITEMS = [
    { id:"window",   slot:"wallL", ko:"언덕 창문",     en:"Hillside window" },
    { id:"frame",    slot:"wallL", ko:"들꽃 액자",     en:"Wildflower frame" },
    { id:"shelf",    slot:"wallR", ko:"책 선반",       en:"Book shelf" },
    { id:"clock",    slot:"wallR", ko:"나뭇잎 시계",   en:"Leaf clock" },
    { id:"lights",   slot:"ceil",  ko:"전구 가랜드",   en:"String lights" },
    { id:"vine",     slot:"ceil",  ko:"잎사귀 덩굴",   en:"Leafy vine" },
    { id:"monstera", slot:"floorL",ko:"몬스테라 화분", en:"Monstera pot" },

  // 위쪽에 걸리는 장식 (x0~x1 사이를 늘어지게)

  // 홈 상단을 방으로 그리기: 벽(유형 색) + 나무 바닥 + 놓인 아이템
  function paintRoom(){
    var hero = document.querySelector("#screen-home .home-hero");
    var canvas = document.getElementById("home-room");
    var stage = hero && hero.querySelector(".char-stage");
    if (!hero || !canvas || !stage || !state) return;
    var W = hero.clientWidth, H = hero.clientHeight;
    if (!W || !H) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = W*dpr; canvas.height = H*dpr;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    var u = Math.min(W / 380, 1.15);
    var F = stage.offsetTop + stage.offsetHeight*0.8;        // 바닥선 = 캐릭터 발 높이
    var T = TYPE_THEME[state.typeKey] || TYPE_THEME.ES;
    var rm = ensureRoom();

    // 벽
    ctx.fillStyle = T.tint; ctx.fillRect(0, 0, W, F);
    ctx.fillStyle = "rgba(255,255,255,0.28)";
    for (var sx = 14; sx < W; sx += 28){ ctx.fillRect(sx, 0, 10, F); }       // 은은한 벽지 줄무늬
    ctx.fillStyle = "rgba(255,255,255,0.45)"; ctx.fillRect(0, F - 34*u, W, 34*u);  // 아래 벽 판넬
    ctx.fillStyle = "rgba(31,51,38,0.08)"; ctx.fillRect(0, F - 34*u, W, 2*u);
    // 바닥
    var fl = ctx.createLinearGradient(0, F, 0, H);
    fl.addColorStop(0, "#e9d2ab"); fl.addColorStop(1, "#dcc092");
    ctx.fillStyle = fl; ctx.fillRect(0, F, W, H - F);
    ctx.strokeStyle = "rgba(140,100,60,0.18)"; ctx.lineWidth = 1;
    for (var py = F + 18; py < H; py += 18){ ctx.beginPath(); ctx.moveTo(0, py); ctx.lineTo(W, py); ctx.stroke(); }
    ctx.fillStyle = "#c99a66"; ctx.fillRect(0, F - 3*u, W, 5*u);             // 걸레받이

    var show = rm.show;
    if (show.rug) drawRoomItem(ctx, show.rug, W/2, F + 16*u, u);
    if (show.wallL) drawRoomItem(ctx, show.wallL, W*0.15, F - 96*u, u);
    if (show.wallR) drawRoomItem(ctx, show.wallR, W*0.85, F - 96*u, u);
    if (show.ceil) drawRoomString(ctx, show.ceil, -4, W + 4, 12*u, 10*u, u);

      h += '</div>';
      var multi = {}; rm.owned.forEach(function(id){ var sl = roomItem(id).slot; multi[sl] = (multi[sl] || 0) + 1; });
      if (Object.keys(multi).some(function(k){ return multi[k] > 1; })) h += '<div class="cap-row">' + esc(R.ownedHint) + '</div>';
    }
    h += '</div>';
    roomJustAdded = null;
    return h;
  }
  function wireRoom(box){
    Array.prototype.forEach.call(box.querySelectorAll("canvas[data-item]"), function(c){ drawItemPreview(c, c.getAttribute("data-item")); });
    Array.prototype.forEach.call(box.querySelectorAll("[data-room-pick]"), function(b){
      b.addEventListener("click", function(){
        claimRoomItem(b.getAttribute("data-room-pick"));
        renderHome();
        var rc = document.getElementById("room-card");
        if (rc) rc.scrollIntoView({ block: "nearest", behavior: "smooth" });
      });
    });
    Array.prototype.forEach.call(box.querySelectorAll("[data-room-show]"), function(b){
      b.addEventListener("click", function(){
        var it = roomItem(b.getAttribute("data-room-show"));
        var rm = ensureRoom();
        if (rm.show[it.slot] === it.id) delete rm.show[it.slot]; else rm.show[it.slot] = it.id;   // 다시 누르면 치우기
        saveState(); renderHome();
      });
    });
  }

  function renderHome(){
    if (!state) return;
    ensurePlan(); ensureActLog();
    var s = t();
    var type = TYPES[state.typeKey][LANG];
    var compat = TYPES[TYPES[state.typeKey].compatKey][LANG];
    var tk = dayKey(new Date());
    var wroteToday = !!(state.journal || {})[tk];
    var actToday = checksOnly().some(function(e){ return e.day === tk && e.done; });
    var bright = wroteToday || actToday;
    var severe = state.level === "severe";
    var streak = streakCount();
    var total = Object.keys(state.journal || {}).length + checksOnly().filter(function(e){ return e.done; }).length;
    var lvNum = Math.floor(total / MISSIONS_PER_LEVEL) + 1;
    var into = total % MISSIONS_PER_LEVEL;

    document.getElementById("home-hello").textContent = s.homeHello(type.name);
    document.getElementById("home-title").textContent = s.homeTitle(state.name);
    document.getElementById("home-bubble").textContent =
      bright ? (streak >= 2 ? s.bubbleStreak(streak) : s.bubbleDone) : (severe ? s.bubbleSevere : s.bubbleTodo);
    // 일기를 쓰거나 활동을 하면 캐릭터 표정이 밝아짐
    paintChar(document.getElementById("home-char"), 150, state.typeKey, bright ? "mild" : state.level);
    applyTypeTint(document.querySelector("#screen-home .home-hero"), state.typeKey);
    document.getElementById("home-lv").textContent = "Lv." + lvNum;
    document.getElementById("home-xp").style.width = Math.round(into / MISSIONS_PER_LEVEL * 100) + "%";
    document.getElementById("home-xp-note").textContent = s.xpNote(MISSIONS_PER_LEVEL - into);

    var html = "";
    if (severe) html += crisisHtml(s);
    // 동의 여부를 아직 고르지 않은 사용자(기존 사용자 포함)에게는 홈 맨 위에서 물어봄
    if (!CONSENT_DECIDED){
      html += '<div class="card"><div class="card-eyebrow"><span>' + esc(s.consentCardTitle) + '</span></div>' +
        '<div class="policy" tabindex="0" role="region" aria-label="' + esc((PRIVACY_TEXT[LANG] || PRIVACY_TEXT.ko).title) + '">' + privacyHtml() + '</div>' +
        '<div class="card-desc" style="margin-top:10px;color:var(--ink);">' + esc(s.consentLabel) + '</div>' +
        '<div class="card-actions"><button type="button" class="btn btn-primary" id="c-yes">' + esc(s.consentYes) + '</button>' +
        '<button type="button" class="btn btn-ghost" id="c-no">' + esc(s.consentNo) + '</button></div></div>';
    }

    // 1) 감정 회복 일기 (기본)
    html += diaryCardHtml(s, tk);

    // 1-1) 몽가의 방 꾸미기 (기록한 날 5일마다 아이템 1개)
    html += roomCardHtml();

    // 2) 이번 주 회복 활동 요약 → 회복 활동 화면으로
    var cur = state.weekAct && state.weekAct.wk === weekKey(new Date()) ? state.weekAct : null;
    var curAct = cur ? actById(cur.id) : null;
    var actStatus = prevWeekUnchecked() ? s.homeActPrev : (cur && cur.checked ? s.homeActDone : s.homeActTodo);
    html += '<div class="card"><div class="card-eyebrow"><span>' + esc(s.homeActTitle) + '</span>' + (curAct ? actTag(s, curAct) : '') + '</div>' +
      (curAct && !prevWeekUnchecked() ? '<div class="card-title" style="font-size:17px;">' + esc(curAct[LANG]) + '</div>' : '') +
      '<div class="card-desc">' + esc(actStatus) + '</div>' +
      '<div class="card-actions"><button type="button" class="btn btn-ghost" id="h-goact">' + esc(s.homeActGo) + '</button></div></div>';

    // 3) 연속 기록 + 이번 주
    html += '<div class="card"><div class="card-eyebrow"><span>' + esc(s.streakTitle) + '</span></div>' +
      '<div class="streak-top" style="margin-top:6px;"><span class="streak-num">' + streak + '</span><span class="streak-label">' +
      (streak === 0 ? esc(s.streakZero) : esc(s.streakUnit) + ' · ' + esc(s.streakKeep)) + '</span></div><div class="week">';
    for (var i = 6; i >= 0; i--){
      var d = addDays(new Date(), -i);
      var dk = dayKey(d);
      var on = recordedOn(dk);
      html += '<div class="day' + (on ? " done" : "") + (i === 0 ? " today" : "") + '">' + s.weekdays[d.getDay()] +
        '<i>' + (on ? "✓" : "") + '</i></div>';
    }
    html += '</div></div>';

    // 4) 스트레스 변화 기록 + 주간/전체 체크
    var hist = state.history.slice(-6);
    var last = state.history[state.history.length - 1];
    var lastFull = null;
    state.history.forEach(function(h){ if (h.kind !== "weekly") lastFull = h; });
    var daysSince = last ? Math.floor((Date.now() - last.ts) / 86400000) : RECHECK_DAYS;
    var fullDue = !lastFull || Math.floor((Date.now() - lastFull.ts) / 86400000) >= FULL_DAYS;
    var due = daysSince >= RECHECK_DAYS;
    html += '<div class="card"><div class="card-eyebrow"><span>' + esc(s.historyTitle) + '</span><span style="color:var(--ink-faint);font-weight:400;">' +
      esc(due ? (fullDue ? s.fullDue : s.recheckDue) : s.recheckIn(RECHECK_DAYS - daysSince)) + '</span></div>';
    if (state.weeklyMsg){
      html += '<div class="delta">' + esc(s.weeklyDone(state.weeklyMsg.score, s.burnoutLabel[state.weeklyMsg.level])) + '</div>';
      delete state.weeklyMsg; saveState();
    }
    if (hist.length >= 2){
      html += '<div class="bars">';
      hist.forEach(function(h, j){
        var dt = new Date(h.ts);
        html += '<div class="bar' + (h.kind === "weekly" ? " wk" : "") + (j === hist.length - 1 ? " last" : "") + '"><em>' + h.score + '</em>' +
          '<span style="height:' + Math.max(8, Math.round(h.score / 40 * 56)) + 'px"></span>' + (dt.getMonth()+1) + '/' + dt.getDate() + '</div>';
      });
      html += '</div>';
      var diff = hist[hist.length-1].score - hist[hist.length-2].score;
      html += '<div class="delta">' + esc(diff < 0 ? s.deltaDown(-diff) : (diff > 0 ? s.deltaUp(diff) : s.deltaSame)) + '</div>';
      if (hist.some(function(h){ return h.kind === "weekly"; })) html += '<div class="cap-row">' + esc(s.weeklyNote) + '</div>';
    } else {
      html += '<div class="card-desc" style="margin-top:8px;">' + esc(s.historyEmpty) + '</div>';
    }
    var primaryFull = fullDue && due;
    html += '<div class="card-actions"><button type="button" class="btn ' + (due ? "btn-primary" : "btn-ghost") + '" id="h-recheck">' +
      esc(primaryFull ? s.fullBtn : s.weeklyBtn) + '</button></div>' +
      '<div style="margin-top:10px;"><button type="button" class="link-btn" id="h-recheck-alt">' + esc(primaryFull ? s.weeklyBtn : s.fullBtn) + '</button></div></div>';

    // 5) 케미 유형 + 친구 초대
    html += '<div class="card"><div class="card-eyebrow"><span>' + esc(s.chemTitle) + '</span></div>' +
      '<div class="chem" style="margin-top:8px;"><canvas id="h-chem-char" aria-hidden="true"></canvas><div>' +
      '<div class="card-title" style="margin:0 0 2px;">' + esc(compat.name) + '</div>' +
      '<div class="card-desc" style="font-size:13px;">' + esc(type.compatDesc) + '</div></div></div>' +
      '<div class="card-actions"><button type="button" class="btn btn-ghost" id="h-invite">' + esc(s.chemInvite) + '</button></div>' +
      '<div class="note" id="h-invite-status" style="margin:8px 0 0;" aria-live="polite"></div></div>';

    // 6) 기록 백업 (기기·브라우저 변경용, 서버 전송 없음)
    html += '<div class="card"><div class="card-eyebrow"><span>' + esc(s.backupTitle) + '</span></div>' +
      '<div class="card-desc" style="margin-top:8px;">' + esc(s.backupDesc) + '</div>' +
      '<input type="password" class="name-input backup-pw" id="h-backup-pw" autocomplete="new-password" placeholder="' + esc(s.backupPwLabel) + '" aria-label="' + esc(s.backupPwLabel) + '" aria-describedby="h-backup-hint">' +
      '<div class="cap-row" id="h-backup-hint">' + esc(s.backupPwHint) + '</div>' +
      '<div class="card-actions"><button type="button" class="btn btn-ghost" id="h-backup-save">' + esc(s.backupSave) + '</button>' +
      '<button type="button" class="btn btn-ghost" id="h-backup-load">' + esc(s.backupLoad) + '</button></div>' +
      '<div class="note backup-status" id="h-backup-status" role="status" aria-live="polite"></div></div>';

    html += '<div style="text-align:center;margin:6px 0 18px;display:flex;flex-direction:column;gap:10px;align-items:center;">' +
      '<button type="button" class="link-btn" id="h-result">' + esc(s.viewResultBtn) + '</button>' +
      '<button type="button" class="link-btn" id="h-consent">' + esc(CONSENT ? s.consentOn : s.consentOff) + '</button>' +
      '<button type="button" class="link-btn" id="h-reset">' + esc(s.resetLink) + '</button>' +
      '<div class="cap-row" style="margin-top:0;">' + esc(s.uidLabel) + ': <span style="user-select:all;">' + esc(UID) + '</span></div></div>';

    var box = document.getElementById("home-cards");
    box.innerHTML = html;
    paintChar(document.getElementById("h-chem-char"), 64, TYPES[state.typeKey].compatKey, "mild");
    wireDiary(box, s, tk);
    wireRoom(box);
    requestAnimationFrame(paintRoom);
    updateTabs();
    var cYes = document.getElementById("c-yes"), cNo = document.getElementById("c-no");
    if (cYes) cYes.addEventListener("click", function(){ setConsent(true); renderHome(); });
    if (cNo) cNo.addEventListener("click", function(){ setConsent(false); renderHome(); });
    document.getElementById("h-goact").addEventListener("click", function(){ goTab("activity"); });
    document.getElementById("h-recheck").addEventListener("click", function(){ startQuiz(primaryFull ? "full" : "weekly"); });
    document.getElementById("h-recheck-alt").addEventListener("click", function(){ startQuiz(primaryFull ? "weekly" : "full"); });
    document.getElementById("h-consent").addEventListener("click", function(){ setConsent(!CONSENT); renderHome(); });
    document.getElementById("h-backup-save").addEventListener("click", function(){
      saveBackup(document.getElementById("h-backup-pw"), this, document.getElementById("h-backup-status"));
    });
    document.getElementById("h-backup-load").addEventListener("click", function(){
      pickBackup(document.getElementById("h-backup-status"));
    });
    document.getElementById("h-reset").addEventListener("click", function(){
      if (window.confirm(s.resetConfirm)) restartFresh();
    });
    document.getElementById("h-result").addEventListener("click", function(){
      lastSummaryParts = { burnoutSum: state.burnoutSum, level: state.level, typeKey: state.typeKey, viewOnly: true };
      document.getElementById("name-input").value = state.name || "";
      showScreen(elResult);
      renderResultTexts();
    });
    document.getElementById("h-invite").addEventListener("click", function(){
      var text = s.inviteText(type.name);
      var url = appLink();
      var full = text + (url ? "\n" + url : "");
      var status = document.getElementById("h-invite-status");
      function fallback(){
        copyText(full).then(function(ok){
          if (ok){ status.textContent = s.inviteCopied; }
          else { status.innerHTML = esc(shareUI().inviteManual) + '<div class="invite-manual">' + esc(full) + '</div>'; }
        });
      }
      if (navigator.share && !IS_INAPP){
        // 링크는 url 칸에, 문구는 text 칸에 따로 넣어야 카카오톡·문자 등에서 링크 미리보기가 붙음
        navigator.share(url ? { title: s.shareTitle, text: text, url: url } : { title: s.shareTitle, text: text })
          .catch(function(err){ if (!err || err.name !== "AbortError") fallback(); });
      } else {
        fallback();
      }
    });
  }

  // ================= 기록 백업 파일 (기기·브라우저 변경용) =================
  // 이 기기의 기록을 파일 하나로 내려받고, 다른 기기에서 그 파일로 되살립니다. 네트워크 전송 없음.
  // 동의 여부는 기기마다 새로 정하도록 옮기지 않고, 시트 기록이 이어지도록 익명 ID는 옮깁니다.
  var BACKUP_KEYS = ["monga_state", "monga_last_result", "monga_uid", "monga_lang"];
  var BACKUP_APP = "monga-backup";
  var PBKDF2_ROUNDS = 250000;

  function b64(bytes){ var str = ""; bytes.forEach(function(b){ str += String.fromCharCode(b); }); return btoa(str); }
  function unb64(text){ var str = atob(text), out = new Uint8Array(str.length); for (var i = 0; i < str.length; i++) out[i] = str.charCodeAt(i); return out; }
  function hasCrypto(){ return !!(window.crypto && crypto.subtle && window.TextEncoder); }
  function deriveKey(pw, salt){
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]).then(function(base){
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: PBKDF2_ROUNDS, hash: "SHA-256" },
        base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
    });
  }
  function collectBackupData(){
    var data = {};
    BACKUP_KEYS.forEach(function(k){ var v = localStorage.getItem(k); if (v !== null) data[k] = v; });
    return data;
  }
  function buildBackupText(pw){
    var data = collectBackupData();
    var head = { app: BACKUP_APP, v: 1, createdAt: new Date().toISOString() };
    if (!pw) return Promise.resolve(JSON.stringify(Object.assign(head, { enc: false, data: data })));
    var salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    return deriveKey(pw, salt).then(function(key){
      return crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, new TextEncoder().encode(JSON.stringify(data)));
    }).then(function(ct){
      return JSON.stringify(Object.assign(head, { enc: true, kdf: "PBKDF2-SHA256", rounds: PBKDF2_ROUNDS,
        salt: b64(salt), iv: b64(iv), ct: b64(new Uint8Array(ct)) }));
    });
  }
  function setStatus(el, msg){ if (el) el.textContent = msg; }

  function saveBackup(pwInput, btn, statusEl){
    var s = t(), pw = pwInput ? pwInput.value : "";
    if (pw && !hasCrypto()){ setStatus(statusEl, s.backupNoCrypto); return; }
    btn.disabled = true;
    setStatus(statusEl, "");
    buildBackupText(pw).then(function(text){
      var d = new Date(), pad = function(n){ return (n < 10 ? "0" : "") + n; };
      downloadBlob(new Blob([text], { type: "application/json" }),
        "monga-backup-" + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + ".json");
      if (pwInput) pwInput.value = "";
      setStatus(statusEl, s.backupSaved);
    }).catch(function(err){
      console.error("backup failed", err && err.name);
      setStatus(statusEl, s.backupFailed);
    }).then(function(){ btn.disabled = false; });
  }

  // 파일 내용을 검사해 복원할 데이터를 돌려줌. 실패하면 사용자에게 보여줄 문구로 reject.
  function readBackupText(text){
    var s = t(), file;
    try { file = JSON.parse(text); } catch(e){ return Promise.reject(s.backupBadFile); }
    if (!file || file.app !== BACKUP_APP || file.v !== 1) return Promise.reject(s.backupBadFile);
    var checkData = function(data){
      if (!data || typeof data !== "object") throw s.backupBadFile;
      var st;
      try { st = JSON.parse(data.monga_state); } catch(e){ throw s.backupBadFile; }
      if (!st || !st.typeKey) throw s.backupBadFile;
      var clean = {};
      BACKUP_KEYS.forEach(function(k){ if (typeof data[k] === "string") clean[k] = data[k]; });
      return clean;
    };
    if (!file.enc) return Promise.resolve(file.data).then(checkData);
    if (!hasCrypto()) return Promise.reject(s.backupNoCrypto);
    var pw = window.prompt(s.backupPwPrompt);
    if (pw === null || pw === "") return Promise.reject(s.backupCanceled);
    var salt, iv, ct;
    try { salt = unb64(file.salt); iv = unb64(file.iv); ct = unb64(file.ct); } catch(e){ return Promise.reject(s.backupBadFile); }
    return deriveKey(pw, salt).then(function(key){
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ct);
    }).then(function(plain){
      var data;
      try { data = JSON.parse(new TextDecoder().decode(plain)); } catch(e){ throw s.backupBadFile; }
      return checkData(data);
    }, function(){ throw s.backupWrongPw; });
  }

  function applyBackupData(data){
    BACKUP_KEYS.forEach(function(k){ localStorage.removeItem(k); });
    Object.keys(data).forEach(function(k){ localStorage.setItem(k, data[k]); });
    location.replace(location.href.split(/[?#]/)[0]);
  }

  var backupStatusEl = null;
  function pickBackup(statusEl){
    backupStatusEl = statusEl;
    setStatus(statusEl, "");
    var input = document.getElementById("backup-file");
    input.value = "";
    input.click();
  }
  document.getElementById("backup-file").addEventListener("change", function(){
    var s = t(), file = this.files && this.files[0], statusEl = backupStatusEl;
    if (!file) return;
    file.text().then(readBackupText).then(function(data){
      if (state && !window.confirm(s.backupConfirm)){ setStatus(statusEl, s.backupCanceled); return; }
      applyBackupData(data);
    }).catch(function(msg){
      if (typeof msg !== "string"){ console.error("restore failed", msg && msg.name); msg = s.backupBadFile; }
      setStatus(statusEl, msg);
    });
  });
  document.getElementById("intro-restore").addEventListener("click", function(){
    pickBackup(document.getElementById("intro-restore-status"));
  });

  mergeModelActivities(); // 지난번에 받아둔 참여자 제안 활동을 먼저 반영
  applyLanguage();
  paintCast(document.getElementById("hero-cast"));
  if (state){ renderHome(); showScreen(elHome); }
  fetchModel(); // 최신 참여자 집계를 받아와 추천 점수에 반영
})();
</script>
