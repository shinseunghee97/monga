<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monga 스트레스 셀프 체크</title>
<!-- 카카오톡·문자로 링크를 보냈을 때 보이는 미리보기. 배포 후 og:image에 대표 이미지(1200x630 권장) 주소를 넣으세요. -->
<meta name="description" content="3분이면 나의 스트레스 신호와 회복 유형, 나에게 맞는 회복 활동을 알 수 있어요.">
<meta property="og:type" content="website">
<meta property="og:title" content="Monga 몽가 · 나의 회복 유형 찾기">
<meta property="og:description" content="3분이면 나의 스트레스 신호와 회복 유형, 나에게 맞는 회복 활동을 알 수 있어요.">
<!-- <meta property="og:image" content="https://배포주소/og.png"> -->
<meta name="theme-color" content="#3f6e4e">
<style>
  /* Google Fonts; canvas rendering explicitly waits for these fonts below. */
  @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap');

  /* ============================================================
     Monga 디자인 토큰 — "숲속 문구점"
     이끼 초록(주색) · 꿀빛 노랑(포인트) · 볼터치 분홍(귀여움) · 안개 낀 세이지 종이(배경)
     ============================================================ */
  :root{
    --bg: #e9ecdc;            /* 세이지 안개 종이 */
    --bg-deep: #dfe5cf;
    --card: #fffef9;
    --ink: #1f3326;           /* 깊은 숲 */
    --ink-soft: #4f6152;
    --ink-faint: #8a9686;
    --green: #3f6e4e;         /* 이끼 */
    --green-deep: #2a4d37;
    --green-pale: #e2ebd6;
    --orange: #e9a93a;        /* 꿀빛 (이름은 기존 코드 호환용) */
    --orange-pale: #fbefd2;
    --blush: #f3b5a8;
    --blush-pale: #fbe6df;
    --line: rgba(31,51,38,0.11);
    --line-strong: rgba(31,51,38,0.2);
    --track: #e7e8d8;
    --shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 24px 48px -28px rgba(31,51,38,0.45);
    --shadow-soft: 0 10px 24px -18px rgba(31,51,38,0.45);
    --surface: #f7f6ec;
    --press: 0 3px 0 #23422f;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #141b16; --bg-deep: #101611;
      --card: #1d2620;
      --ink: #eef0e4; --ink-soft: #b7c3b0; --ink-faint: #7f8d7c;
      --green: #86bd8b; --green-deep: #b4dcb4; --green-pale: #2a3a2d;
      --orange: #f0c060; --orange-pale: #3a3220;
      --blush: #e8a598; --blush-pale: #3a2a27;
      --line: rgba(238,240,228,0.12); --line-strong: rgba(238,240,228,0.22);
      --track: #2a342c;
      --shadow: 0 24px 48px -24px rgba(0,0,0,0.6);
      --shadow-soft: 0 10px 24px -16px rgba(0,0,0,0.6);
      --surface: #232e26;
      --press: 0 3px 0 #4f7d58;
      --tint-mix: 16%;
    }
  }
  :root[data-theme="dark"]{
    --bg: #141b16; --bg-deep: #101611;
    --card: #1d2620;
    --ink: #eef0e4; --ink-soft: #b7c3b0; --ink-faint: #7f8d7c;
    --green: #86bd8b; --green-deep: #b4dcb4; --green-pale: #2a3a2d;
    --orange: #f0c060; --orange-pale: #3a3220;
    --blush: #e8a598; --blush-pale: #3a2a27;
    --line: rgba(238,240,228,0.12); --line-strong: rgba(238,240,228,0.22);
    --track: #2a342c;
    --shadow: 0 24px 48px -24px rgba(0,0,0,0.6);
    --shadow-soft: 0 10px 24px -16px rgba(0,0,0,0.6);
    --surface: #232e26;
    --press: 0 3px 0 #4f7d58;
    --tint-mix: 16%;
  }

  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    color: var(--ink);
    font-family: 'Gowun Dodum', 'Noto Sans KR', sans-serif;
    display:flex;
    justify-content:center;
    padding: 20px 16px;
    min-height: 100%;
    background-color: var(--bg);
    /* 은은한 종이 결 + 흩어진 작은 잎 패턴 */
    background-image:
      radial-gradient(circle at 12% 18%, rgba(63,110,78,.07) 0 2px, transparent 3px),
      radial-gradient(circle at 78% 64%, rgba(233,169,58,.09) 0 2px, transparent 3px),
      radial-gradient(1200px 600px at 50% -10%, var(--bg-deep), transparent 70%);
    background-size: 46px 46px, 62px 62px, 100% 100%;
  }
  .display{ font-family:'Jua','Gowun Dodum',sans-serif; }
  :focus-visible{ outline: 2.5px solid var(--orange); outline-offset: 2px; border-radius: 10px; }

  .phone{
    position:relative;
    width:100%;
    max-width: 440px;
    background: var(--card);
    border-radius: 34px;
    box-shadow: var(--shadow);
    border: 1px solid var(--line);
    overflow: hidden;
    display:flex;
    flex-direction:column;
    min-height: min(820px, 92vh);
  }

  /* ---- language toggle ---- */
  .lang-toggle{
    position:absolute; top:14px; right:14px; z-index:30;
    display:flex; gap:2px; background: color-mix(in srgb, var(--card) 88%, transparent);
    backdrop-filter: blur(6px);
    border:1px solid var(--line); border-radius:999px; padding:3px;
    box-shadow: var(--shadow-soft);
  }
  .lang-btn{
    border:none; background:transparent; cursor:pointer;
    padding:6px 12px; border-radius:999px; font-size:12px;
    color: var(--ink-faint);
  }
  .lang-btn.active{ background: var(--green); color:#fff; }

  /* ---- progress (덩굴이 자라는 느낌) ---- */
  .progress-wrap{ padding: 20px 24px 0; }
  .progress-track{
    position:relative; height:10px; border-radius:99px;
    background: var(--track); overflow:visible;
  }
  .progress-fill{
    position:relative;
    height:100%; width:0%;
    background: repeating-linear-gradient(115deg, var(--green) 0 10px, color-mix(in srgb, var(--green) 82%, #fff) 10px 20px);
    border-radius:99px;
    transition: width .45s cubic-bezier(.3,1.4,.5,1);
  }
  .progress-fill::after{   /* 끝에 달린 새싹 */
    content:''; position:absolute; right:-7px; top:50%; width:16px; height:16px; margin-top:-8px;
    border-radius: 2px 50% 50% 50%; transform: rotate(45deg);
    background: var(--orange); box-shadow: 0 0 0 3px var(--card);
  }
  .progress-label{
    margin-top:10px; font-size:12.5px; color: var(--ink-faint);
    display:flex; justify-content:space-between;
  }

  .screen{ display:flex; flex-direction:column; flex:1; min-height:0; }
  .scroll{ flex:1; overflow-y:auto; padding: 20px 24px 6px; }

  /* ---- intro ---- */
  .hero{
    position:relative; height:244px; overflow:hidden;
    background: linear-gradient(180deg, #fbefcf 0%, #eef1dc 62%, #e2ead2 100%);
  }
  .hero svg{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .hero-cast{ position:absolute; left:0; right:0; bottom:10px; width:100%; height:150px; display:block; }
  .intro-body{ padding: 18px 26px 22px; text-align:center; display:flex; flex-direction:column; gap:14px; align-items:center; }
  .logotype{
    font-size: 40px; color: var(--green-deep); letter-spacing:.5px; line-height:1;
    text-shadow: 0 3px 0 var(--orange-pale);
  }
  .tagline{ color: var(--ink-soft); font-size:14.5px; line-height:1.7; max-width:310px; }
  .steps-mini{
    display:flex; align-items:stretch; margin-top:4px; width:100%;
    background: var(--surface); border:1px solid var(--line); border-radius:18px; padding:4px;
  }
  .step-mini{
    flex:1; position:relative; border-radius:14px; padding:11px 6px 10px;
    font-size:12.5px; color: var(--ink-soft); text-align:center; line-height:1.45;
  }
  .step-mini + .step-mini::before{
    content:''; position:absolute; left:-4px; top:50%; width:8px; height:8px; margin-top:-4px;
    border-radius: 2px 50% 50% 50%; transform: rotate(-45deg); background: var(--green-pale);
  }
  .step-mini b{
    display:grid; place-items:center; width:26px; height:26px; margin: 0 auto 5px;
    border-radius:50%; background: var(--green); color:#fff; font-size:13px;
  }

  /* ---- buttons (말랑한 눌림감) ---- */
  .btn-row{ padding: 14px 22px calc(18px + env(safe-area-inset-bottom,0px)); display:flex; gap:10px; border-top:1px solid var(--line); background: var(--card); }
  button{ font-family:inherit; cursor:pointer; }
  .btn{
    flex:1; border:none; border-radius:18px; padding:14px 16px 13px;
    font-size:16px;
    transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  .btn-primary{ background: var(--green); color:#fff; box-shadow: var(--press); }
  .btn-primary:active{ transform: translateY(2px); box-shadow: 0 1px 0 #23422f; }
  .btn-primary:disabled{ opacity:.38; cursor:not-allowed; box-shadow:none; transform:none; }
  .btn-ghost{ background: var(--card); color: var(--ink-soft); border:1.5px solid var(--line-strong); }
  .btn-ghost:active{ transform: scale(.97); }
  .btn-wide{ width:100%; }

  /* ---- question ---- */
  .q-eyebrow{
    display:inline-block; font-size:12.5px; color: var(--green-deep);
    background: var(--green-pale); padding:4px 10px; border-radius:99px;
  }
  .q-text{ font-family:'Jua',sans-serif; font-size: 21px; line-height:1.5; margin: 14px 0 24px; color:var(--ink); word-break: keep-all; }
  .scale{ display:flex; flex-direction:column; gap:9px; }
  .opt{
    display:flex; align-items:center; gap:12px;
    border:1.5px solid var(--line); border-radius:16px; padding:13px 14px;
    font-size:14.5px; color: var(--ink-soft); background: var(--card);
    transition: border-color .15s ease, background .15s ease, transform .12s ease;
  }
  .opt:active{ transform: scale(.985); }
  .opt .dot{ width:22px; height:22px; border-radius:50%; border:2px solid var(--line-strong); flex:none; position:relative; background: var(--card); }
  .opt[aria-pressed="true"]{ border-color: var(--green); color: var(--ink); background: var(--green-pale); }
  .opt[aria-pressed="true"] .dot{ border-color: var(--green); background: var(--green); }
  .opt[aria-pressed="true"] .dot::after{  /* 체크 대신 작은 잎 */
    content:''; position:absolute; inset:5px; border-radius: 1px 50% 50% 50%; transform: rotate(45deg); background:#fff;
  }
  .scale-caption{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-faint); margin-top:10px; }

  /* ---- result ---- */
  .result-badge{
    display:inline-flex; align-items:center; gap:8px; background:var(--orange-pale); color:#8a5a12;
    font-size:13px; padding:7px 14px; border-radius:99px; margin-bottom:14px;
  }
  .result-badge::before{ content:''; width:8px; height:8px; border-radius:50%; background: var(--orange); }
  .type-card{
    position:relative; overflow:hidden;
    background: color-mix(in srgb, var(--type-tint, var(--green-pale)) var(--tint-mix, 100%), var(--card));
    border-radius: 140px 140px 26px 26px;   /* 아치형 창 */
    padding: 26px 22px 24px; margin-bottom:18px; text-align:center;
  }
  .type-card::before{   /* 아치 안쪽 하이라이트 */
    content:''; position:absolute; inset:8px; border-radius: 132px 132px 20px 20px;
    border: 1.5px dashed rgba(255,255,255,.75); pointer-events:none;
  }
  .type-name{ position:relative; font-size:32px; color: color-mix(in srgb, var(--type-ink, var(--green-deep)) var(--tint-mix, 100%), var(--ink)); line-height:1.1; }
  .type-desc{ position:relative; font-size:14px; color: var(--ink-soft); line-height:1.65; margin: 8px auto 0; max-width: 320px; word-break: keep-all; }
  .section-label{ font-size:16px; color:var(--ink); margin: 24px 0 10px; display:flex; align-items:center; gap:8px; }
  .section-label::before{ content:''; width:10px; height:10px; border-radius: 1px 50% 50% 50%; transform: rotate(45deg); background:var(--green); }
  .activity{
    border:1px solid var(--line); background: var(--surface); border-radius:16px; padding:13px 14px; margin-bottom:8px;
    display:flex; gap:10px; align-items:flex-start; font-size:14px; line-height:1.55;
  }
  .activity .tag{
    flex:none; font-size:11.5px; color:var(--green-deep); background:var(--green-pale);
    padding:3px 9px; border-radius:99px; margin-top:1px;
  }
  .note{ font-size:12.5px; color:var(--ink-faint); line-height:1.65; margin: 18px 0 4px; }

  .name-input{
    width:100%; font-family:inherit; font-size:14.5px; color:var(--ink);
    background: var(--card); border:1.5px solid var(--line-strong); border-radius:14px;
    padding:13px 14px; margin: 10px 0 12px;
  }
  .name-input:focus{ border-color: var(--green); outline:none; box-shadow: 0 0 0 4px var(--green-pale); }
  .name-input::placeholder{ color: var(--ink-faint); }
  .share-row{ display:flex; gap:10px; }
  .share-row .btn{ padding:13px 14px 12px; font-size:15px; }
  #copy-status{ min-height: 1.4em; color: var(--green-deep); }

  .share-preview-wrap{
    margin: 4px 0 14px; border-radius:22px; overflow:hidden;
    border:6px solid var(--card); outline:1px solid var(--line); box-shadow: var(--shadow-soft); background: var(--track);
    min-height: 80px; display:flex; align-items:center; justify-content:center;
    transform: rotate(-1deg);
  }
  .share-preview-wrap img{ width:100%; display:block; }
  .share-preview-label{ font-size:11.5px; color: var(--ink-faint); margin: 2px 0 8px; text-align:center; }

  /* ---- character ---- */
  .char-stage{
    position:relative; width:176px; height:176px; margin: 0 auto 4px;
    display:grid; place-items:center; border-radius:50%;
  }
  .char-stage::before{   /* 캐릭터 뒤 햇살 원 */
    content:''; position:absolute; inset:14px; border-radius:50%;
    background: radial-gradient(circle at 50% 45%, rgba(255,255,255,.95), rgba(255,255,255,0) 70%);
  }
  .char-stage::after{
    content:''; position:absolute; bottom:16px; left:50%; width:78px; height:12px; margin-left:-39px;
    border-radius:50%; background: rgba(31,51,38,0.14); filter: blur(2px);
    animation: shadow 3.6s ease-in-out infinite;
  }
  .char-canvas{ width:150px; height:150px; display:block; animation: bob 3.6s ease-in-out infinite; position:relative; z-index:1; transform-origin: 50% 90%; }
  @keyframes bob{ 0%,100%{ transform: translateY(0) scale(1,1); } 45%{ transform: translateY(-8px) scale(.985,1.015); } 90%{ transform: translateY(0) scale(1.02,.98); } }
  @keyframes shadow{ 45%{ transform: scaleX(.8); opacity:.6; } }
  .type-card .char-stage{ width:176px; height:176px; }
  .type-card .char-canvas{ width:150px; height:150px; }

  .bubble{
    position:relative; background: var(--card); border:1.5px solid var(--line-strong); color: var(--ink);
    border-radius:20px; padding:11px 16px; font-size:13.5px; line-height:1.55;
    max-width: 280px; margin: 0 auto 6px; box-shadow: var(--shadow-soft); text-align:center; word-break: keep-all;
  }
  .bubble::after{
    content:''; position:absolute; bottom:-8px; left:50%; width:13px; height:13px; margin-left:-6.5px;
    background: var(--card); border-right:1.5px solid var(--line-strong); border-bottom:1.5px solid var(--line-strong);
    transform: rotate(45deg); border-bottom-right-radius: 4px;
  }

  /* ---- home ---- */
  .home-head{ padding: 24px 24px 0; padding-right: 116px; }
  .home-hello{ font-size:12.5px; color: var(--ink-faint); }
  .home-title{ font-size:25px; color: var(--green-deep); margin-top:3px; line-height:1.25; word-break: keep-all; overflow-wrap: anywhere; }
  .home-hero{
    position:relative; margin: 14px 16px 0; padding: 18px 16px 18px; text-align:center;
    background: color-mix(in srgb, var(--type-tint, var(--green-pale)) var(--tint-mix, 100%), var(--card)); border-radius: 28px;
  }
  .home-hero{ overflow:hidden; padding-bottom: 14px; }
  .room-canvas{ position:absolute; left:0; top:0; display:block; pointer-events:none; }
  .home-hero > .bubble, .home-hero > .char-stage, .home-hero > .lv-plate{ position:relative; z-index:1; }
  .home-hero .char-stage::before{ display:none; }
  .lv-plate{
    margin: 30px auto 0; max-width: 300px; padding: 9px 12px 8px; border-radius: 18px;
    background: color-mix(in srgb, var(--card) 92%, transparent); box-shadow: var(--shadow-soft);
  }
  .lv-plate .xp-track{ background: var(--track); }
  .lv-row{ display:flex; align-items:center; gap:10px; margin: 0 auto; max-width: 290px; }
  /* 방 꾸미기 카드 */
  .room-offer{ display:grid; grid-template-columns: repeat(3,1fr); gap:8px; margin-top:12px; }
  .room-pick{
    display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 4px 10px;
    border:1.5px solid var(--line); background: var(--card); border-radius:18px;
    font-family:'Jua',sans-serif; font-size:12.5px; color: var(--ink); line-height:1.3;
    transition: transform .12s ease, border-color .12s ease;
  }
  .room-pick:hover{ border-color: var(--green); }
  .room-pick:active{ transform: scale(.95); }
  .room-pick canvas{ width:72px; height:72px; display:block; border-radius:14px; background: #f8f1df; }
  .room-progress{ display:flex; align-items:center; gap:6px; margin-top:12px; }
  .room-progress i{ flex:1; height:10px; border-radius:99px; background: var(--track); }
  .room-progress i.on{ background: var(--green); }
  .room-progress .gift{
    flex:none; width:26px; height:26px; border-radius:9px; background: var(--orange); position:relative;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.08);
  }
  .room-progress .gift::before{ content:''; position:absolute; left:50%; top:0; bottom:0; width:5px; margin-left:-2.5px; background:#fff; opacity:.85; }
  .room-progress .gift::after{ content:''; position:absolute; top:50%; left:0; right:0; height:5px; margin-top:-2.5px; background:#fff; opacity:.85; }
  .room-added{ margin-top:8px; padding:8px 12px; border-radius:12px; background: var(--green-pale); color: var(--green-deep); font-family:'Jua',sans-serif; font-size:13.5px; }
  .lv-chip{ flex:none; font-family:'Jua',sans-serif; font-size:14px; color:#fff; background: var(--green); border-radius:99px; padding:4px 11px; }
  .xp-track{ flex:1; height:10px; border-radius:99px; background: rgba(255,255,255,.7); overflow:hidden; }
  .xp-fill{ height:100%; background: var(--orange); border-radius:99px; transition: width .6s cubic-bezier(.3,1.3,.5,1); }
  .xp-note{ font-size:11.5px; color: var(--ink-soft); margin-top:7px; }

  .card{ background: var(--surface); border:1px solid var(--line); border-radius:22px; padding:16px 16px; margin-bottom:12px; }
  .card-eyebrow{ font-size:12.5px; color: var(--green); display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .card-title{ font-family:'Jua',sans-serif; font-size:20px; color: var(--ink); margin: 6px 0 4px; line-height:1.35; word-break: keep-all; }
  .card-desc{ font-size:14px; color: var(--ink-soft); line-height:1.6; word-break: keep-all; }
  .card .btn{ padding:12px 14px 11px; font-size:14.5px; }
  .card-actions{ display:flex; gap:8px; margin-top:14px; }
  .link-btn{ border:none; background:none; color: var(--ink-faint); font-size:12px; text-decoration: underline; padding:0; }
  .link-btn.tall{ min-height:44px; padding:0 12px; font-size:13px; color: var(--ink-soft); }
  .backup-pw{ margin-top:12px; }
  #h-backup-save, #h-backup-load{ flex:1; word-break: keep-all; }
  .backup-status{ margin:8px 0 0; }
  .backup-status:empty{ display:none; }

  .streak-top{ display:flex; align-items:baseline; gap:8px; }
  .streak-num{ font-family:'Jua',sans-serif; font-size:38px; color: var(--orange); line-height:1; }
  .streak-label{ font-size:13.5px; color: var(--ink-soft); }
  .week{ display:grid; grid-template-columns: repeat(7, 1fr); gap:4px; margin-top:14px; }
  .day{ text-align:center; font-size:11px; color: var(--ink-faint); }
  .day i{
    display:grid; place-items:center; width:32px; height:32px; margin: 5px auto 0; border-radius:50%;
    background: var(--track); font-style:normal; font-size:14px; color:#fff;
  }
  .day.done i{ background: var(--green); border-radius: 4px 50% 50% 50%; }
  .day.today i{ box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--orange); }

  .mission-tag{ font-size:11.5px; color: var(--green-deep); background: var(--green-pale); padding:3px 9px; border-radius:99px; }
  .mood-q{ font-size:14px; color: var(--ink); margin-top:14px; }
  .mood-row{ display:grid; grid-template-columns: repeat(3,1fr); gap:8px; margin-top:8px; }
  .mood{
    border:1.5px solid var(--line); background: var(--card); border-radius:16px; padding:10px 4px;
    font-size:12px; color: var(--ink-soft); line-height:1.4;
  }
  .mood b{ display:block; font-size:22px; margin-bottom:2px; }
  .mood:active{ transform: scale(.96); }
  .done-card{ background: linear-gradient(150deg, var(--green-pale), var(--surface) 75%); }
  .locked{ border-style: dashed; background: transparent; display:flex; gap:12px; align-items:center; }
  .locked .lock{ flex:none; width:40px; height:40px; border-radius:14px; background: var(--track); display:grid; place-items:center; font-size:18px; }

  .bars{ display:flex; align-items:flex-end; gap:8px; height:84px; margin-top:14px; }
  .bar{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:4px; font-size:10.5px; color: var(--ink-faint); }
  .bar span{ display:block; width:100%; max-width:30px; border-radius:12px 12px 5px 5px; background: var(--green-pale); }
  .bar.last span{ background: var(--orange); }
  .bar em{ font-style:normal; color: var(--ink-soft); }
  .delta{ font-size:13px; color: var(--green-deep); margin-top:10px; }

  .chem{ display:flex; gap:12px; align-items:center; }
  .chem canvas{ flex:none; width:68px; height:68px; background: var(--card); border-radius:50%; border:1px solid var(--line); }

  @keyframes pop{ 0%{ transform:scale(.92); opacity:0; } 70%{ transform:scale(1.02); opacity:1; } 100%{ transform:scale(1); } }
  .pop{ animation: pop .4s ease; }

  /* ---- consent ---- */
  .consent{ width:100%; text-align:left; background: var(--surface); border:1px solid var(--line); border-radius:18px; padding:12px 14px; font-size:13px; color: var(--ink-soft); line-height:1.55; }
  .consent label{ display:flex; gap:10px; align-items:flex-start; cursor:pointer; color: var(--ink); }
  .consent input{ width:18px; height:18px; margin-top:2px; accent-color: var(--green); flex:none; }
  .consent details{ margin-top:8px; }
  .consent summary{ cursor:pointer; color: var(--ink-faint); font-size:12px; }
  .consent dl{ margin:8px 0 0; display:grid; grid-template-columns: auto 1fr; gap:4px 10px; font-size:12px; }
  .consent dt{ color: var(--ink-faint); }
  .consent dd{ margin:0; }

  /* ---- 하단 탭 (일기 / 회복 활동) ---- */
  .tabbar{
    display:grid; grid-template-columns:1fr 1fr; gap:6px; padding: 8px 14px calc(10px + env(safe-area-inset-bottom, 0px));
    border-top:1px solid var(--line); background: var(--card);
  }
  .tab{ position:relative; border:none; background:transparent; border-radius:16px; padding:8px 4px 8px; color: var(--ink-faint); font-family:'Jua',sans-serif; font-size:13px; display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; }
  .tab b{ font-size:19px; font-weight:400; filter: grayscale(1); opacity:.55; }
  .tab.active{ color: var(--green-deep); background: var(--green-pale); }
  .tab.active b{ filter:none; opacity:1; }
  .tab-dot{ position:absolute; top:7px; left:calc(50% + 12px); width:8px; height:8px; border-radius:50%; background: var(--orange); box-shadow: 0 0 0 2px var(--card); }

  /* ---- 회복 활동 화면 ---- */
  .chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip{ border:1.5px solid var(--line); background: var(--card); border-radius:99px; padding:6px 12px; font-size:13px; color: var(--ink-soft); cursor:pointer; }
  .chip[aria-pressed="true"]{ border-color: var(--green); background: var(--green-pale); color: var(--ink); }
  .opt-row.two{ grid-template-columns: repeat(2,1fr); }
  .community-tag{ font-size:11px; color: #8a5a12; background: var(--orange-pale); border-radius:99px; padding:2px 8px; margin-left:6px; }
  .sugg{ display:flex; justify-content:space-between; gap:8px; font-size:13px; color: var(--ink-soft); padding:8px 0; border-top:1px solid var(--line); }
  .sugg:first-child{ border-top:none; }
  .sugg em{ font-style:normal; flex:none; font-size:11.5px; color: var(--ink-faint); }

  /* ---- 개인정보 수집·이용 동의서 스크롤 박스 ---- */
  .policy{
    margin-top:10px; max-height:150px; overflow-y:auto; -webkit-overflow-scrolling:touch;
    background: var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px;
    font-size:12px; line-height:1.6; color: var(--ink-soft); text-align:left;
  }
  .policy:focus{ outline:2px solid var(--green); outline-offset:1px; }
  .policy h4{ margin:0 0 6px; font-family:'Jua',sans-serif; font-weight:400; font-size:14px; color: var(--ink); }
  .policy h5{ margin:10px 0 2px; font-family:'Jua',sans-serif; font-weight:400; font-size:13px; color: var(--green-deep); }
  .policy p{ margin:0; }
  .policy ul{ margin:0; padding-left:16px; }
  .policy li{ margin:2px 0; }
  .policy .policy-officer{ margin-top:10px; color: var(--ink-faint); }

  /* ---- crisis / safety ---- */
  .crisis{ background: var(--blush-pale); border:1px solid color-mix(in srgb, var(--blush) 60%, transparent); border-radius:20px; padding:14px 16px; margin: 0 0 12px; text-align:left; }
  .crisis-title{ font-family:'Jua',sans-serif; font-size:17px; color: var(--ink); }
  .crisis-desc{ font-size:13px; color: var(--ink-soft); line-height:1.55; margin:4px 0 10px; }
  .crisis-lines{ display:flex; flex-direction:column; gap:6px; }
  .crisis-lines a{ display:flex; justify-content:space-between; align-items:center; gap:8px; text-decoration:none; color: var(--ink); background: var(--card); border:1px solid var(--line); border-radius:14px; padding:9px 12px; font-size:13px; }
  .crisis-lines a b{ font-family:'Jua',sans-serif; font-size:17px; color: var(--green-deep); }

  /* ---- check-in options / plan note ---- */
  .opt-row{ display:grid; grid-template-columns: repeat(3,1fr); gap:8px; margin-top:8px; }
  .plan-note{ display:flex; gap:8px; align-items:flex-start; margin-top:12px; padding:10px 12px; border-radius:14px; background: var(--card); border:1px solid var(--line); font-size:13px; color: var(--ink); line-height:1.5; }
  .plan-note i{ font-style:normal; flex:none; }
  .cap-row{ font-size:12px; color: var(--ink-faint); margin-top:8px; }
  .fit-row{ display:flex; align-items:center; gap:10px; margin-top:10px; font-size:13px; color: var(--ink); }
  .fit-row .fit-name{ flex:none; width:58px; }
  .fit-track{ flex:1; height:10px; border-radius:99px; background: var(--track); overflow:hidden; }
  .fit-fill{ height:100%; background: var(--green); border-radius:99px; }
  .fit-num{ flex:none; font-size:11.5px; color: var(--ink-faint); min-width: 74px; text-align:right; }
  .bar.wk span{ background: var(--track); }
  .bar.wk.last span{ background: var(--orange); opacity:.75; }

  /* ---- 글꼴 정리 ----
     본문 글꼴(Gowun Dodum)은 보통 굵기 하나뿐이라 가짜 굵게를 끄고, 강조 라벨·버튼은 Jua 한 가지로 통일. */
  *{ font-synthesis: none; }
  b, strong{ font-weight:400; }
  .btn, .lang-btn, .result-badge, .section-label, .activity .tag, .mission-tag, .card-eyebrow, .q-eyebrow,
  .lv-chip, .mood-q, .delta, .fit-name, .crisis-lines a b, #copy-status, .step-mini b, .day.today, .back-btn{
    font-family:'Jua','Gowun Dodum',sans-serif; font-weight:400; letter-spacing:.2px;
  }
  .day.today{ color: var(--orange); }
  .activity{ color: var(--ink-soft); }

  /* ---- emotion diary ---- */
  .emo-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:6px; margin-top:10px; }
  .emo{ border:1.5px solid var(--line); background: var(--card); border-radius:14px; padding:8px 4px; font-size:12.5px; color: var(--ink-soft); line-height:1.35; }
  .emo b{ display:block; font-size:20px; margin-bottom:2px; }
  .emo[aria-pressed="true"]{ border-color: var(--green); background: var(--green-pale); color: var(--ink); }
  .diary-text{
    width:100%; min-height:78px; resize:vertical; font-family:inherit; font-size:14px; color: var(--ink);
    background: var(--card); border:1.5px solid var(--line); border-radius:14px; padding:10px 12px; margin-top:10px; line-height:1.7;
    background-image: repeating-linear-gradient(transparent 0 23px, var(--line) 23px 24px);
    background-position: 0 9px;
  }
  .diary-text:focus{ border-color: var(--green); outline:none; }
  .diary-text::placeholder{ color: var(--ink-faint); }
  .entry{ border-top:1px dashed var(--line-strong); padding:12px 0 4px; }
  .entry:first-of-type{ border-top:none; }
  .entry-head{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:12px; color: var(--ink-faint); }
  .entry-day{ font-family:'Jua',sans-serif; font-size:15px; color: var(--green-deep); }
  .entry-emo{ font-size:14px; color: var(--ink); margin-top:4px; }
  .entry-text{ font-size:14px; color: var(--ink-soft); line-height:1.6; margin-top:4px; white-space:pre-wrap; word-break:break-word; }
  .entry-act{ font-size:12px; color: var(--ink-faint); margin-top:4px; }
  .journal-head{ display:flex; flex-direction:column; align-items:flex-start; gap:12px; padding:18px 20px 4px; }
  .back-btn{ border:1.5px solid var(--line-strong); background: var(--card); border-radius:14px; padding:8px 12px; color: var(--ink); font-size:14px; cursor:pointer; white-space:nowrap; }
  .flow{ display:grid; grid-template-columns: repeat(7,1fr); gap:4px; text-align:center; font-size:11px; color: var(--ink-faint); margin-top:10px; }
  .flow span{ display:block; font-size:20px; margin-top:4px; min-height:28px; }

  /* ---- 길게 눌러 저장 시트 ---- */
  .save-sheet{
    position:fixed; inset:0; z-index:100; background: rgba(20,30,22,.55);
    display:flex; align-items:flex-end; justify-content:center; padding: 16px;
    animation: sheetIn .2s ease;
  }
  .save-sheet-box{
    width:100%; max-width:440px; max-height: calc(100vh - 32px); overflow-y:auto;
    background: var(--card); border-radius: 28px; padding: 18px 18px 16px; box-shadow: var(--shadow);
  }
  .save-sheet-title{ font-size:19px; color: var(--ink); text-align:center; margin-bottom:12px; }
  .save-sheet-img{ border-radius:18px; overflow:hidden; border:1px solid var(--line); max-height: 56vh; overflow-y:auto; background: var(--track); }
  .save-sheet-img img{ width:100%; display:block; -webkit-touch-callout: default; user-select: auto; }
  .save-sheet-tip{ font-size:13px; color: var(--ink-soft); line-height:1.6; margin-top:10px; word-break: keep-all; }
  @keyframes sheetIn{ from{ opacity:0; } to{ opacity:1; } }
  .invite-manual{
    margin-top:8px; padding:10px 12px; border-radius:12px; background: var(--card); border:1px dashed var(--line-strong);
    color: var(--ink); font-family:'Gowun Dodum',sans-serif; white-space:pre-wrap; word-break:break-all;
    -webkit-user-select: all; user-select: all;
  }

  [hidden]{ display:none !important; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; animation:none !important; } }
</style>

<body>
<div class="phone" id="phone">

  <div class="lang-toggle" id="lang-toggle" role="group" aria-label="Language / 언어">

  </div>

  <!-- INTRO -->
  <section class="screen" id="screen-intro">
    <div class="hero">
      <svg viewBox="0 0 440 244" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <!-- 햇무리 -->
        <circle cx="300" cy="70" r="64" fill="#ffffff" opacity="0.35"/>

          <path d="M58 62 a14 14 0 0 1 26 -6 a11 11 0 0 1 18 8 a9 9 0 0 1 -2 18 h-40 a10 10 0 0 1 -2 -20z"/>
          <path d="M360 120 a10 10 0 0 1 19 -4 a8 8 0 0 1 13 6 a6 6 0 0 1 -1 12 h-29 a7 7 0 0 1 -2 -14z" opacity="0.8"/>
        </g>
        <!-- 먼 산 -->
        <path d="M-10 170 C 60 120, 120 128, 180 150 C 240 172, 300 118, 370 132 C 410 140, 430 150, 450 146 L 450 244 L -10 244 Z" fill="#cfe0bf"/>

        <!-- 작은 풀꽃 -->
        <g fill="#fffef9"><circle cx="34" cy="222" r="3"/><circle cx="118" cy="228" r="2.4"/><circle cx="252" cy="226" r="2.6"/><circle cx="404" cy="224" r="3"/></g>
        <g fill="#f6c86a"><circle cx="34" cy="222" r="1.2"/><circle cx="404" cy="224" r="1.2"/></g>

    <div class="intro-body">
      <div class="logotype display" id="intro-logo">Monga 몽가</div>
      <div class="tagline" id="intro-tagline">스트레스를 혼자 견디지 않아도 되도록.<br>3분이면 내 회복 방향을 알 수 있어요.</div>
      <div class="steps-mini">
        <div class="step-mini"><b>1</b><span id="intro-step-1">스트레스 체크</span></div>

        <label><input type="checkbox" id="consent-check"><span id="consent-label"></span></label>
      </div>
      <button type="button" class="link-btn tall" id="intro-restore">백업 파일로 이어서 쓰기</button>
      <div class="note backup-status" id="intro-restore-status" role="status" aria-live="polite"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary btn-wide" id="btn-start">시작하기</button>
    </div>
  </section>

  <!-- QUIZ -->
  <section class="screen" id="screen-quiz" hidden>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-label"><span id="progress-section">스트레스 체크</span><span id="progress-count">1 / 16</span></div>
    </div>
    <div class="scroll">
      <div class="q-eyebrow" id="q-eyebrow">STEP 1</div>
      <div class="q-text" id="q-text">질문이 여기에 표시됩니다.</div>
      <div class="scale" id="q-scale"></div>
      <div class="scale-caption"><span id="scale-caption-left">전혀 아니다</span><span id="scale-caption-right">매우 그렇다</span></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="btn-prev">이전</button>
      <button class="btn btn-primary" id="btn-next" disabled>다음</button>
    </div>
  </section>

  <!-- RESULT -->
  <section class="screen" id="screen-result" hidden>
    <div class="scroll">
      <div class="result-badge" id="result-badge">스트레스 · 중등도</div>
      <div class="type-card">
        <div class="char-stage"><canvas class="char-canvas" id="result-char" aria-hidden="true"></canvas></div>
        <div class="type-name display" id="type-name">숲그늘형</div>
        <div class="type-desc" id="type-desc">설명이 여기 표시됩니다.</div>
      </div>
      <div class="note" id="burnout-note"></div>
      <div id="result-crisis"></div>
      <div class="section-label" id="label-activities">나에게 맞는 회복 활동</div>
      <div id="activity-list"></div>

      <div class="section-label" id="label-share">결과 공유하기</div>
      <div class="note" id="share-note" style="margin-top:0;">내 회복 유형과 나랑 잘 맞는 유형을 이미지로 저장하거나 친구에게 공유해보세요.</div>
      <input type="text" id="name-input" class="name-input" placeholder="이미지에 표시할 닉네임 (선택)" aria-label="이미지에 표시할 닉네임 (선택)" />
      <div class="share-preview-label" id="preview-label">공유될 이미지 미리보기</div>
      <div class="share-preview-wrap"><img id="share-preview" alt="공유 이미지 미리보기" /></div>
      <div class="share-row">
        <button class="btn btn-primary" id="btn-share">이미지로 공유하기</button>
        <button class="btn btn-ghost" id="btn-copy">이미지 저장하기</button>

  <!-- HOME (재방문 사용자의 첫 화면: 캐릭터 · 연속 기록 · 오늘의 미션 · 변화 기록) -->

<script>
(function(){

  var CONSENT = false;

  try {
    var savedConsent = localStorage.getItem("monga_consent");
    CONSENT = savedConsent === "1";

  } catch(e){}
  // 동의 시각: 동의한 순간의 기기 시각(한국 시간 등 사용자 기기 기준)을 저장하고, 시트로 보내는 모든 행에 함께 기록
  var CONSENT_AT = "";

  if (CONSENT && !CONSENT_AT) CONSENT_AT = "기록 없음(이전 버전에서 동의)";
  function localStamp(d){
    function p(n){ return (n < 10 ? "0" : "") + n; }
    var off = -d.getTimezoneOffset(), sign = off >= 0 ? "+" : "-";
    off = Math.abs(off);
    return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds()) +
      " (UTC" + sign + p(Math.floor(off/60)) + ":" + p(off%60) + ")";
  }
  function setConsent(v){
    v = !!v;
    var was = CONSENT;
    if (v && !was){
      CONSENT_AT = localStamp(new Date());
      try { localStorage.setItem("monga_consent_at", CONSENT_AT); } catch(e){}
      sendConsentEvent("동의", CONSENT_AT);
    } else if (!v && was){
      // 철회 기록은 철회 사실과 시각만 남김 (이후 데이터는 보내지 않음)
      sendConsentEvent("철회", localStamp(new Date()));
      CONSENT_AT = "";
      try { localStorage.removeItem("monga_consent_at"); } catch(e){}
    }
    CONSENT = v; CONSENT_DECIDED = true;
    try { localStorage.setItem("monga_consent", v ? "1" : "0"); } catch(e){}
  }
  function sendConsentEvent(action, at){

    fetch(SHEET_WEBHOOK_URL, { method: "POST", mode: "no-cors", body: body }).catch(function(){});
  }
  var UID = (function(){
    var id = null;
    try { id = localStorage.getItem("monga_uid"); } catch(e){}

    }
    return id;
  })();

  // ---- 결과 이미지(1장) 생성 ----
  // 관리자용 원본 응답(문항별 점수)은 포함하지 않고, 참여자에게 필요한 3가지만 담습니다:
  // 1) 내 기질 유형  2) 추천 회복 활동  3) 케미가 잘 맞는 유형
  function wrapText(ctx, text, x, y, maxWidth, lineHeight){
    var words = text.split(" ");
    var line = "";
    for (var n = 0; n < words.length; n++){
      var testLine = line + words[n] + " ";
      if (ctx.measureText(testLine).width > maxWidth && n > 0){
        ctx.fillText(line, x, y);
        line = words[n] + " ";
        y += lineHeight;
      } else {
        line = testLine;
      }
    }
    ctx.fillText(line, x, y);
    return y + lineHeight;
  }

  function roundedRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  function countWrapLines(ctx, text, maxWidth){
    var words = text.split(" ");
    var lines = 1, line = "";
    for (var n = 0; n < words.length; n++){
      var testLine = line + words[n] + " ";
      if (ctx.measureText(testLine).width > maxWidth && n > 0){ lines++; line = words[n] + " "; }
      else { line = testLine; }
    }
    return lines;
  }

  // ---- 캐릭터 일러스트 (몽가 4총사) ----
  // 공통 실루엣: 말랑한 찹쌀떡 몸 + 짧은 팔다리 + 큰 눈 + 볼터치, 갈색 외곽선과 흰 스티커 테두리.
  // 스트레스 표정은 기질마다 다르게 표현:
  //   태양형  중간=애써 웃음+땀 / 높음=햇살이 시들고 눈이 빙글빙글, 머리에서 김이 남(방전)
  //   숲그늘형 중간=걱정 눈썹+새싹이 처짐 / 높음=글썽이는 눈+눈물, 잎이 시들어 떨어짐
  //   바람형  중간=시무룩한 반쯤 감은 눈+앞머리가 엉킴 / 높음=질끈 감은 눈, 회색 비구름이 되어 비가 내림
  //   달빛형  중간=졸린 눈+하품 / 높음=ㅠㅠ 우는 눈, 달이 이지러져 그늘이 짐
  var CHAR_OUT = "#3a2c22";
  var TYPE_THEME = {
    EA: { tint:"#fbe6b4", deep:"#c07a16", ink:"#7a4a0c", body:"#f9b347", bodyHi:"#ffd27e", accent:"#ffdf8a" },
    ES: { tint:"#dcebcf", deep:"#3f7a4a", ink:"#2a4d37", body:"#9fcd8c", bodyHi:"#c4e3b0", accent:"#5f9e63" },
    IA: { tint:"#d8eeea", deep:"#3f8f86", ink:"#245d57", body:"#e4f5f1", bodyHi:"#ffffff", accent:"#86cbc0" },
    IS: { tint:"#e4e2f3", deep:"#5d68a3", ink:"#3d4677", body:"#f8e8a8", bodyHi:"#fff5cf", accent:"#7280ba" }
  };
  var LEVEL_COLOR = { mild:"#4f9a63", moderate:"#d9962a", severe:"#d46f5e" };

  function mochiPath(ctx, cx, cy, w, h){
    var top = cy - h/2, bot = cy + h/2, l = cx - w/2, rr = cx + w/2;
    ctx.beginPath();
    ctx.moveTo(cx, top);
    ctx.bezierCurveTo(cx + w*0.40, top, rr, cy - h*0.16, rr, cy + h*0.12);
    ctx.bezierCurveTo(rr, bot - h*0.02, cx + w*0.30, bot, cx, bot);
    ctx.bezierCurveTo(cx - w*0.30, bot, l, bot - h*0.02, l, cy + h*0.12);
    ctx.bezierCurveTo(l, cy - h*0.16, cx - w*0.40, top, cx, top);
    ctx.closePath();
  }
  // 외곽선 먼저 → 채우기 (겹치는 부위는 자연스럽게 한 덩어리로 보임)
  function inkFill(ctx, fill, lw){
    ctx.lineWidth = lw; ctx.strokeStyle = CHAR_OUT; ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.stroke();
    ctx.fillStyle = fill; ctx.fill();
  }
  function bodyFill(ctx, cx, cy, r, base, hi){
    var g = ctx.createRadialGradient(cx - r*0.35, cy - r*0.55, r*0.1, cx, cy, r*1.25);
    g.addColorStop(0, hi); g.addColorStop(0.55, base); g.addColorStop(1, base);
    return g;
  }
  function sparkle(ctx, x, y, s, color){
    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, y - s);
    ctx.quadraticCurveTo(x + s*0.18, y - s*0.18, x + s, y);
    ctx.quadraticCurveTo(x + s*0.18, y + s*0.18, x, y + s);
    ctx.quadraticCurveTo(x - s*0.18, y + s*0.18, x - s, y);
    ctx.quadraticCurveTo(x - s*0.18, y - s*0.18, x, y - s);
    ctx.fill();
    ctx.restore();
  }
  function leafPath(ctx, x, y, len, wid, ang){
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(len*0.5, -wid, len, 0);
    ctx.quadraticCurveTo(len*0.5, wid, 0, 0);
    ctx.closePath();
    ctx.restore();
  }
  function dropPath(ctx, x, y, s){
    ctx.beginPath();
    ctx.moveTo(x, y - s);
    ctx.quadraticCurveTo(x + s*0.75, y + s*0.25, x, y + s*0.75);
    ctx.quadraticCurveTo(x - s*0.75, y + s*0.25, x, y - s);
  }

  // ---- 얼굴 부품 (r = 몸 크기 단위, (cx, cy) = 두 눈의 가운데) ----
  var EYE_X = 0.36;
  function eyesBig(ctx, cx, cy, r){
    [-1,1].forEach(function(d){
      var x = cx + d*r*EYE_X;
      ctx.fillStyle = CHAR_OUT;
      ctx.beginPath(); ctx.ellipse(x, cy, r*0.12, r*0.155, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(x + r*0.04, cy - r*0.06, r*0.05, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x - r*0.045, cy + r*0.06, r*0.024, 0, Math.PI*2); ctx.fill();
    });
  }
  function eyesDot(ctx, cx, cy, r){
    [-1,1].forEach(function(d){
      var x = cx + d*r*EYE_X;
      ctx.fillStyle = CHAR_OUT;
      ctx.beginPath(); ctx.ellipse(x, cy + r*0.02, r*0.085, r*0.1, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(x + r*0.028, cy - r*0.02, r*0.03, 0, Math.PI*2); ctx.fill();
    });
  }
  function eyesHappy(ctx, cx, cy, r, lw){       // ^ ^ (애써 웃는 눈)
    ctx.lineWidth = lw;
    [-1,1].forEach(function(d){
      ctx.beginPath(); ctx.arc(cx + d*r*EYE_X, cy + r*0.05, r*0.1, Math.PI*1.15, Math.PI*1.85); ctx.stroke();
    });
  }
  function eyesHalf(ctx, cx, cy, r, lw, lid){   // 반쯤 감은 시무룩한 눈
    [-1,1].forEach(function(d){
      var x = cx + d*r*EYE_X;
      ctx.fillStyle = CHAR_OUT;
      ctx.beginPath(); ctx.ellipse(x, cy + r*0.03, r*0.1, r*0.11, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = lid;
      ctx.fillRect(x - r*0.14, cy - r*0.14, r*0.28, r*0.15);
      ctx.lineWidth = lw;
      ctx.beginPath(); ctx.moveTo(x - r*0.13, cy + r*0.01 - d*r*0.01); ctx.lineTo(x + r*0.13, cy + r*0.01 + d*r*0.01); ctx.stroke();
    });
  }
  function eyesSpiral(ctx, cx, cy, r, lw){      // 빙글빙글 (방전)
    ctx.lineWidth = lw*0.8;
    [-1,1].forEach(function(d){
      var x = cx + d*r*EYE_X;
      ctx.beginPath();
      for (var t = 0; t <= 1.0001; t += 0.05){
        var a = d*t*Math.PI*4.2, rad = r*0.13*t;
        var px = x + Math.cos(a)*rad, py = cy + Math.sin(a)*rad;
        if (t === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    });
  }
  function eyesTeary(ctx, cx, cy, r){           // 글썽이는 눈
    [-1,1].forEach(function(d){
      var x = cx + d*r*EYE_X;
      ctx.fillStyle = CHAR_OUT;
      ctx.beginPath(); ctx.ellipse(x, cy, r*0.13, r*0.16, 0, 0, Math.PI*2); ctx.fill();
      ctx.save(); ctx.clip();
      ctx.fillStyle = "rgba(150,210,240,0.75)";
      ctx.beginPath(); ctx.ellipse(x, cy + r*0.15, r*0.16, r*0.08, 0, 0, Math.PI*2); ctx.fill();
      ctx.restore();
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(x + r*0.045, cy - r*0.06, r*0.055, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x - r*0.05, cy + r*0.02, r*0.03, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + r*0.05, cy + r*0.06, r*0.02, 0, Math.PI*2); ctx.fill();
    });
  }
  function eyesSqueeze(ctx, cx, cy, r, lw){     // > < 질끈 감은 눈
    ctx.lineWidth = lw;
    [-1,1].forEach(function(d){
      var x = cx + d*r*EYE_X;
      ctx.beginPath();
      ctx.moveTo(x - d*r*0.1, cy - r*0.09);
      ctx.lineTo(x + d*r*0.07, cy);
      ctx.lineTo(x - d*r*0.1, cy + r*0.09);
      ctx.stroke();
    });
  }
  function eyesSleepy(ctx, cx, cy, r, lw){      // ‿ 졸린 눈
    ctx.lineWidth = lw;
    [-1,1].forEach(function(d){
      ctx.beginPath(); ctx.arc(cx + d*r*EYE_X, cy - r*0.02, r*0.1, Math.PI*0.15, Math.PI*0.85); ctx.stroke();
    });
  }
  function eyesCry(ctx, cx, cy, r, lw){         // ㅠ ㅠ 우는 눈
    [-1,1].forEach(function(d){
      var x = cx + d*r*EYE_X;
      ctx.fillStyle = "rgba(150,210,240,0.9)";
      roundedRect(ctx, x - r*0.06, cy + r*0.02, r*0.12, r*0.42, r*0.06); ctx.fill();
      ctx.lineWidth = lw;
      ctx.beginPath(); ctx.moveTo(x - r*0.14, cy); ctx.lineTo(x + r*0.14, cy); ctx.stroke();
    });
  }
  function worriedBrows(ctx, cx, cy, r, lw){
    ctx.lineWidth = lw*0.85;
    [-1,1].forEach(function(d){
      var x = cx + d*r*EYE_X;
      ctx.beginPath();
      ctx.moveTo(x - d*r*0.12, cy - r*0.3);
      ctx.lineTo(x + d*r*0.1, cy - r*0.22);
      ctx.stroke();
    });
  }
  function mouthOpen(ctx, cx, cy, r, lw){
    var my = cy + r*0.2;
    ctx.beginPath();
    ctx.moveTo(cx - r*0.15, my);
    ctx.quadraticCurveTo(cx, my + r*0.02, cx + r*0.15, my);
    ctx.quadraticCurveTo(cx + r*0.13, my + r*0.2, cx, my + r*0.21);
    ctx.quadraticCurveTo(cx - r*0.13, my + r*0.2, cx - r*0.15, my);
    ctx.closePath();
    ctx.fillStyle = "#8a3b2e"; ctx.fill();
    ctx.lineWidth = lw*0.8; ctx.stroke();
    ctx.save(); ctx.clip();
    ctx.fillStyle = "#f28c86";
    ctx.beginPath(); ctx.ellipse(cx, my + r*0.2, r*0.09, r*0.07, 0, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
  function mouthThinSmile(ctx, cx, cy, r, lw){
    ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(cx - r*0.17, cy + r*0.24); ctx.quadraticCurveTo(cx, cy + r*0.34, cx + r*0.17, cy + r*0.24); ctx.stroke();
  }
  function mouthPout(ctx, cx, cy, r, lw){
    ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(cx - r*0.09, cy + r*0.31); ctx.quadraticCurveTo(cx, cy + r*0.23, cx + r*0.09, cy + r*0.31); ctx.stroke();
  }
  function mouthWobble(ctx, cx, cy, r, lw){
    var wy = cy + r*0.3;
    ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.moveTo(cx - r*0.14, wy);
    ctx.quadraticCurveTo(cx - r*0.07, wy - r*0.07, cx, wy);
    ctx.quadraticCurveTo(cx + r*0.07, wy + r*0.07, cx + r*0.14, wy);
    ctx.stroke();
  }
  function mouthO(ctx, cx, cy, r, lw){
    ctx.beginPath(); ctx.ellipse(cx, cy + r*0.28, r*0.06, r*0.075, 0, 0, Math.PI*2);
    ctx.fillStyle = "#8a3b2e"; ctx.fill(); ctx.lineWidth = lw*0.8; ctx.stroke();
  }
  function sweatDrop(ctx, x, y, r, lw){
    dropPath(ctx, x, y, r*0.17);
    ctx.fillStyle = "#a9daf0"; ctx.fill();
    ctx.lineWidth = lw*0.7; ctx.strokeStyle = CHAR_OUT; ctx.stroke();
  }

  // 표정: 기질(typeKey) × 스트레스 정도(level)
  function drawFace(ctx, cx, cy, r, level, typeKey){
    var lw = Math.max(1.6, r*0.065);
    var T = TYPE_THEME[typeKey] || TYPE_THEME.EA;
    ctx.save();
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.fillStyle = level === "severe" ? "rgba(236,150,140,0.32)" : "rgba(242,128,118,0.5)";
    [-1,1].forEach(function(d){
      ctx.beginPath(); ctx.ellipse(cx + d*r*0.6, cy + r*0.24, r*0.17, r*0.1, 0, 0, Math.PI*2); ctx.fill();
    });
    ctx.fillStyle = CHAR_OUT; ctx.strokeStyle = CHAR_OUT; ctx.lineWidth = lw;

    if (level === "mild"){
      eyesBig(ctx, cx, cy, r); mouthOpen(ctx, cx, cy, r, lw);
    } else if (typeKey === "EA"){
      if (level === "moderate"){ eyesHappy(ctx, cx, cy, r, lw); mouthThinSmile(ctx, cx, cy, r, lw); sweatDrop(ctx, cx + r*0.74, cy - r*0.36, r, lw); }
      else { eyesSpiral(ctx, cx, cy, r, lw); mouthWobble(ctx, cx, cy, r, lw); }
    } else if (typeKey === "ES"){
      if (level === "moderate"){ eyesDot(ctx, cx, cy, r); worriedBrows(ctx, cx, cy, r, lw); mouthPout(ctx, cx, cy, r, lw); }
      else {
        eyesTeary(ctx, cx, cy, r); worriedBrows(ctx, cx, cy, r, lw); mouthWobble(ctx, cx, cy, r, lw);
        dropPath(ctx, cx - r*0.52, cy + r*0.26, r*0.1); ctx.fillStyle = "#a9daf0"; ctx.fill(); ctx.lineWidth = lw*0.6; ctx.stroke();
      }
    } else if (typeKey === "IA"){
      if (level === "moderate"){ eyesHalf(ctx, cx, cy, r, lw, T.body); mouthPout(ctx, cx, cy, r, lw); }
      else { eyesSqueeze(ctx, cx, cy, r, lw); mouthWobble(ctx, cx, cy, r, lw); }
    } else {
      if (level === "moderate"){
        eyesSleepy(ctx, cx, cy, r, lw); mouthO(ctx, cx, cy, r, lw);
        ctx.fillStyle = "#7280ba"; ctx.font = "400 " + Math.round(r*0.32) + "px 'Jua', sans-serif"; ctx.textAlign = "left";
        ctx.fillText("z", cx + r*0.86, cy - r*0.12); ctx.font = "400 " + Math.round(r*0.24) + "px 'Jua', sans-serif"; ctx.fillText("z", cx + r*1.08, cy - r*0.36);
      } else { eyesCry(ctx, cx, cy, r, lw); mouthWobble(ctx, cx, cy, r, lw); }
    }
    ctx.restore();
  }

  function drawLimbs(ctx, cx, cy, r, color, lw){
    [-1,1].forEach(function(d){
      ctx.beginPath(); ctx.ellipse(cx + d*r*0.98, cy + r*0.3, r*0.17, r*0.13, d*0.6, 0, Math.PI*2);
      inkFill(ctx, color, lw);
    });
    [-1,1].forEach(function(d){
      ctx.beginPath(); ctx.ellipse(cx + d*r*0.42, cy + r*0.86, r*0.2, r*0.13, 0, 0, Math.PI*2);
      inkFill(ctx, color, lw);
    });
  }

  // 해님 몽가 (태양형): 꽃잎처럼 둥근 햇살 갈기를 두른 귤빛 찹쌀떡. 많이 지치면 햇살이 시들고 김이 남
  function drawSunIcon(ctx, cx, cy, r, level){
    var T = TYPE_THEME.EA, lw = r*0.07;
    var tired = level === "severe";
    ctx.save();
    if (tired){
      // 방전 김
      ctx.fillStyle = "rgba(200,200,196,0.9)"; ctx.strokeStyle = CHAR_OUT; ctx.lineWidth = lw*0.7;
      [[0.38,-1.32,0.16],[0.62,-1.55,0.12],[0.86,-1.7,0.08]].forEach(function(p){
        ctx.beginPath(); ctx.arc(cx + r*p[0], cy + r*p[1], r*p[2], 0, Math.PI*2); ctx.stroke(); ctx.fill();
      });
    }
    for (var i = 0; i < 12; i++){
      var a = i * Math.PI*2/12 + Math.PI/12;
      var droop = tired ? 0.16*Math.cos(a) : 0;            // 시든 햇살은 아래로 처짐
      var rx = tired ? r*0.24 : r*0.3, ry = tired ? r*0.16 : r*0.2;
      ctx.beginPath();
      ctx.ellipse(cx + Math.cos(a)*r*0.96, cy - r*0.02 + Math.sin(a)*r*0.9 + r*Math.abs(droop), rx, ry, a + droop, 0, Math.PI*2);
      inkFill(ctx, tired ? (i % 2 ? "#ead7a8" : "#e2c27e") : (i % 2 ? T.accent : "#ffc75a"), lw);
    }
    drawLimbs(ctx, cx, cy, r, tired ? "#dca253" : "#f3a233", lw);
    mochiPath(ctx, cx, cy, r*2.0, r*1.86);
    inkFill(ctx, bodyFill(ctx, cx, cy, r, tired ? "#eab063" : T.body, tired ? "#f3cf96" : T.bodyHi), lw);
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.beginPath(); ctx.ellipse(cx - r*0.42, cy - r*0.5, r*0.16, r*0.08, -0.6, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    drawFace(ctx, cx, cy + r*0.06, r, level, "EA");
    if (level === "mild") sparkle(ctx, cx + r*1.2, cy - r*1.05, r*0.16, "#fff3c4");
  }

  // 숲 몽가 (숲그늘형): 머리에 새싹 두 잎, 배에 연둣빛 무늬. 지치면 새싹이 처지고, 많이 지치면 잎이 떨어짐
  function drawForestIcon(ctx, cx, cy, r, level){
    var T = TYPE_THEME.ES, lw = r*0.07;
    var by = cy + r*0.08;
    var leafA = level === "mild" ? [-Math.PI*0.86, -Math.PI*0.16]
              : level === "moderate" ? [-Math.PI*0.97, -Math.PI*0.04]
              : [Math.PI*0.86, Math.PI*0.08];
    var tipX = level === "severe" ? r*0.14 : 0;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx, by - r*0.88);
    ctx.quadraticCurveTo(cx + r*0.04, by - r*1.1, cx + tipX, by - r*(level === "severe" ? 1.14 : 1.26));
    ctx.lineWidth = lw*2.2; ctx.strokeStyle = CHAR_OUT; ctx.lineCap = "round"; ctx.stroke();
    ctx.lineWidth = lw*0.9; ctx.strokeStyle = T.accent; ctx.stroke();
    var ly = by - r*(level === "severe" ? 1.1 : 1.21);
    leafPath(ctx, cx + tipX, ly, r*0.62, r*0.24, leafA[0]); inkFill(ctx, level === "severe" ? "#a9bf7c" : "#7dbb72", lw);
    if (level !== "severe"){
      leafPath(ctx, cx, ly - r*0.01, r*0.7, r*0.27, leafA[1]); inkFill(ctx, T.accent, lw);
    }
    drawLimbs(ctx, cx, by, r, "#86bb74", lw);
    mochiPath(ctx, cx, by, r*2.04, r*1.78);
    inkFill(ctx, bodyFill(ctx, cx, by, r, T.body, T.bodyHi), lw);
    ctx.save();
    mochiPath(ctx, cx, by, r*2.04, r*1.78); ctx.clip();
    ctx.fillStyle = "rgba(240,248,222,0.85)";
    ctx.beginPath(); ctx.ellipse(cx, by + r*0.74, r*0.62, r*0.34, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "rgba(95,158,99,0.28)";
    [[-0.66,-0.42,0.5],[0.7,-0.3,-0.4],[-0.8,0.12,0.2]].forEach(function(p){
      leafPath(ctx, cx + r*p[0], by + r*p[1], r*0.22, r*0.08, p[2]); ctx.fill();
    });
    ctx.restore();
    if (level === "severe"){
      // 떨어진 잎 한 장
      leafPath(ctx, cx + r*0.92, by + r*0.92, r*0.42, r*0.17, -0.25); inkFill(ctx, "#b9c98a", lw*0.9);
    }
    ctx.restore();
    drawFace(ctx, cx, by - r*0.02, r, level, "ES");
    if (level === "mild"){
      ctx.save();
      var fx = cx - r*0.96, fy = by - r*0.62;
      ctx.fillStyle = "#fff";
      ctx.strokeStyle = CHAR_OUT; ctx.lineWidth = lw*0.7;
      for (var k = 0; k < 5; k++){
        var a = k*Math.PI*2/5;
        ctx.beginPath(); ctx.arc(fx + Math.cos(a)*r*0.1, fy + Math.sin(a)*r*0.1, r*0.08, 0, Math.PI*2); ctx.stroke(); ctx.fill();
      }
      ctx.fillStyle = "#f6c453"; ctx.beginPath(); ctx.arc(fx, fy, r*0.07, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }

  // 바람 몽가 (바람형): 소용돌이 앞머리와 바람결 꼬리가 있는 구름. 지치면 앞머리가 엉키고, 많이 지치면 비구름이 됨
  function drawWindIcon(ctx, cx, cy, r, level){
    var T = TYPE_THEME.IA, lw = r*0.07;
    var rainy = level === "severe";
    var base = rainy ? "#cdd8de" : T.body, hi = rainy ? "#eef3f5" : T.bodyHi, acc = rainy ? "#9fb2bd" : T.accent;
    var by = cy + r*0.06;
    var puffs = [[-0.62,-0.18,0.62],[0,-0.42,0.74],[0.62,-0.18,0.62],[-0.7,0.3,0.58],[0.7,0.3,0.58],[0,0.22,0.86]];
    ctx.save();
    ctx.lineCap = "round";
    if (!rainy){
      [[-0.12,1.1,1.66],[0.2,1.12,1.52]].forEach(function(p){
        ctx.beginPath();
        ctx.moveTo(cx + r*p[1], by + r*p[0]);
        ctx.bezierCurveTo(cx + r*(p[1]+0.2), by + r*(p[0]-0.12), cx + r*(p[2]), by + r*(p[0]-0.16), cx + r*p[2], by + r*(p[0]+0.06));
        ctx.strokeStyle = CHAR_OUT; ctx.lineWidth = lw*2.6; ctx.stroke();
        ctx.strokeStyle = acc; ctx.lineWidth = lw*1.2; ctx.stroke();
      });
    } else {
      // 빗방울
      [[-0.95,1.12],[-0.55,1.32],[0.6,1.3],[1.0,1.08]].forEach(function(p){
        dropPath(ctx, cx + r*p[0], by + r*p[1], r*0.14);
        ctx.fillStyle = "#9fd0ea"; ctx.fill(); ctx.lineWidth = lw*0.7; ctx.strokeStyle = CHAR_OUT; ctx.stroke();
      });
    }
    drawLimbs(ctx, cx, by, r, rainy ? "#bccbd2" : "#cfece6", lw);
    puffs.forEach(function(p){ ctx.beginPath(); ctx.arc(cx + r*p[0], by + r*p[1], r*p[2], 0, Math.PI*2); ctx.lineWidth = lw*2; ctx.strokeStyle = CHAR_OUT; ctx.stroke(); });
    var g = bodyFill(ctx, cx, by, r, base, hi);
    puffs.forEach(function(p){ ctx.beginPath(); ctx.arc(cx + r*p[0], by + r*p[1], r*p[2], 0, Math.PI*2); ctx.fillStyle = g; ctx.fill(); });
    ctx.fillStyle = rainy ? "rgba(120,140,155,0.22)" : "rgba(134,203,192,0.22)";
    ctx.beginPath(); ctx.ellipse(cx, by + r*0.7, r*0.9, r*0.22, 0, 0, Math.PI*2); ctx.fill();
    // 앞머리: 평소엔 소용돌이, 지치면 엉킨 실타래
    var sx = cx + r*0.08, sy = by - r*0.78;
    ctx.beginPath();
    if (level === "mild"){
      for (var t = 0; t <= 1.0001; t += 0.04){
        var ang = Math.PI*0.9 + t*Math.PI*2.6, rad = r*0.26*(1 - t*0.85);
        var px = sx + Math.cos(ang)*rad, py = sy + Math.sin(ang)*rad;
        if (t === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
    } else {
      ctx.moveTo(sx - r*0.26, sy + r*0.04);
      for (var k = 0; k < 7; k++){
        var a2 = k*2.3;
        ctx.quadraticCurveTo(sx + Math.cos(a2)*r*0.3, sy + Math.sin(a2)*r*0.16, sx + Math.cos(a2 + 1.2)*r*0.16, sy + Math.sin(a2 + 1.2)*r*0.12);
      }
    }
    ctx.strokeStyle = acc; ctx.lineWidth = lw*1.2; ctx.stroke();
    ctx.restore();
    drawFace(ctx, cx, by - r*0.02, r, level, "IA");
    if (level === "mild") sparkle(ctx, cx - r*1.15, cy - r*0.95, r*0.14, "#bfe9e1");
  }

  // 달빛 몽가 (달빛형): 별 달린 수면 모자를 쓴 버터빛 보름달. 지치면 졸리고, 많이 지치면 달이 이지러짐
  function drawMoonIcon(ctx, cx, cy, r, level){
    var T = TYPE_THEME.IS, lw = r*0.07;
    var by = cy + r*0.1;
    ctx.save();
    drawLimbs(ctx, cx, by, r, "#f1db8c", lw);
    mochiPath(ctx, cx, by, r*2.0, r*1.8);
    inkFill(ctx, bodyFill(ctx, cx, by, r, T.body, T.bodyHi), lw);
    ctx.save();
    mochiPath(ctx, cx, by, r*2.0, r*1.8); ctx.clip();
    ctx.fillStyle = "rgba(214,184,104,0.35)";
    [[0.66,0.12,0.12],[-0.72,0.42,0.09],[0.52,0.56,0.07]].forEach(function(p){
      ctx.beginPath(); ctx.arc(cx + r*p[0], by + r*p[1], r*p[2], 0, Math.PI*2); ctx.fill();
    });
    if (level === "severe"){
      // 이지러진 달 그늘 (오른쪽부터 어두워짐)
      ctx.fillStyle = "rgba(93,104,163,0.26)";
      ctx.beginPath(); ctx.rect(cx - r*1.2, by - r*1.2, r*2.4, r*2.4);
      ctx.arc(cx - r*0.62, by, r*1.32, 0, Math.PI*2, true);
      ctx.fill("evenodd");
    }
    ctx.restore();
    var capDrop = level === "severe" ? r*0.1 : 0;
    var capL = cx - r*0.86, capR = cx + r*0.8, capY = by - r*0.5 + capDrop;
    ctx.beginPath();
    ctx.moveTo(capL, capY);
    if (level === "severe"){   // 축 늘어진 모자
      ctx.bezierCurveTo(cx - r*0.6, by - r*1.25, cx + r*0.5, by - r*1.3, cx + r*1.2, by - r*0.75);
      ctx.bezierCurveTo(cx + r*1.0, by - r*0.6, cx + r*0.9, by - r*0.5, capR, capY);
    } else {
      ctx.bezierCurveTo(cx - r*0.6, by - r*1.35, cx + r*0.3, by - r*1.5, cx + r*1.06, by - r*1.2);
      ctx.bezierCurveTo(cx + r*0.9, by - r*0.98, cx + r*0.82, by - r*0.8, capR, capY);
    }
    ctx.quadraticCurveTo(cx, capY - r*0.22, capL, capY);
    ctx.closePath();
    inkFill(ctx, T.accent, lw);
    sparkle(ctx, cx - r*0.18, by - r*0.95 + capDrop, r*0.13, "#fff2b8");
    sparkle(ctx, cx + r*0.42, by - r*1.1 + capDrop, r*0.08, "#fff2b8");
    ctx.beginPath();
    ctx.moveTo(capL - r*0.06, capY + r*0.02);
    ctx.quadraticCurveTo(cx, capY - r*0.3, capR + r*0.06, capY + r*0.02);
    ctx.lineWidth = r*0.26; ctx.strokeStyle = CHAR_OUT; ctx.lineCap = "round"; ctx.stroke();
    ctx.lineWidth = r*0.13; ctx.strokeStyle = "#fffaf0"; ctx.stroke();
    ctx.beginPath();
    if (level === "severe") ctx.arc(cx + r*1.24, by - r*0.66, r*0.17, 0, Math.PI*2);
    else ctx.arc(cx + r*1.1, by - r*1.12, r*0.17, 0, Math.PI*2);
    inkFill(ctx, "#fffaf0", lw);
    ctx.restore();
    drawFace(ctx, cx, by + r*0.04, r, level, "IS");
  }

  function drawCharacterRaw(ctx, cx, cy, r, typeKey, level){
    if (typeKey === "EA") drawSunIcon(ctx, cx, cy, r, level);
    else if (typeKey === "ES") drawForestIcon(ctx, cx, cy, r, level);
    else if (typeKey === "IA") drawWindIcon(ctx, cx, cy, r, level);
    else if (typeKey === "IS") drawMoonIcon(ctx, cx, cy, r, level);
  }

  // 흰 스티커 테두리 + 부드러운 그림자를 두른 캐릭터 (굿즈 스티커처럼 보이도록)
  function drawCharacterIcon(ctx, cx, cy, r, typeKey, level){
    var tr = ctx.getTransform ? ctx.getTransform() : null;
    if (!tr){ drawCharacterRaw(ctx, cx, cy, r, typeKey, level); return; }
    var scale = Math.abs(tr.a) || 1;
    var half = r*1.9;
    var S = Math.ceil(half*2*scale);
    var off = document.createElement("canvas"); off.width = S; off.height = S;
    var o = off.getContext("2d");
    o.setTransform(scale, 0, 0, scale, S/2 - cx*scale, S/2 - cy*scale);
    drawCharacterRaw(o, cx, cy, r, typeKey, level);

    var sil = document.createElement("canvas"); sil.width = S; sil.height = S;
    var sc = sil.getContext("2d");
    var w = r*0.12*scale;
    for (var i = 0; i < 20; i++){
      var a = i/20*Math.PI*2;
      sc.drawImage(off, Math.cos(a)*w, Math.sin(a)*w);
    }
    sc.globalCompositeOperation = "source-in";
    sc.fillStyle = "#fffefa"; sc.fillRect(0, 0, S, S);

    var dx = cx*tr.a + tr.e - S/2, dy = cy*tr.d + tr.f - S/2;
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.shadowColor = "rgba(31,51,38,0.22)";
    ctx.shadowBlur = r*0.22*scale; ctx.shadowOffsetY = r*0.07*scale;
    ctx.drawImage(sil, dx, dy);
    ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.drawImage(off, dx, dy);
    ctx.restore();
  }

  // 아치 창 안쪽에 유형별 자연 모티프 (해살 · 나뭇잎 · 바람결 · 별)
  function drawMotifs(ctx, typeKey, x, y, w, h, ccx, ccy){
    ctx.save();
    if (typeKey === "EA"){
      ctx.fillStyle = "rgba(255,255,255,0.32)";
      for (var i = 0; i < 18; i++){
        var a0 = i*Math.PI*2/18, a1 = a0 + Math.PI/36;
        ctx.beginPath(); ctx.moveTo(ccx, ccy);
        ctx.arc(ccx, ccy, Math.max(w, h), a0, a1); ctx.closePath(); ctx.fill();
      }
    } else if (typeKey === "ES"){
      ctx.fillStyle = "rgba(63,122,74,0.16)";
      [[0.12,0.2,0.6],[0.86,0.16,-0.8],[0.08,0.62,-0.3],[0.92,0.56,2.4],[0.2,0.4,1.9],[0.8,0.36,0.9],[0.5,0.08,0.2]].forEach(function(p){
        leafPath(ctx, x + w*p[0], y + h*p[1], w*0.07, w*0.026, p[2]); ctx.fill();
      });
    } else if (typeKey === "IA"){
      ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineCap = "round"; ctx.lineWidth = w*0.008;
      [[0.18,0.6],[0.36,0.3],[0.56,0.7],[0.72,0.45]].forEach(function(p){
        var yy = y + h*p[0], xx = x + w*(p[1]-0.25);
        ctx.beginPath(); ctx.moveTo(xx, yy);
        ctx.bezierCurveTo(xx + w*0.12, yy - h*0.03, xx + w*0.24, yy + h*0.03, xx + w*0.36, yy);
        ctx.stroke();
      });
    } else {
      [[0.16,0.24,0.022],[0.84,0.2,0.016],[0.1,0.5,0.012],[0.9,0.48,0.02],[0.3,0.12,0.012],[0.7,0.1,0.014]].forEach(function(p){
        sparkle(ctx, x + w*p[0], y + h*p[1], w*p[2], "rgba(255,255,255,0.9)");
      });
      ctx.fillStyle = "rgba(93,104,163,0.18)";
      [[0.24,0.36],[0.78,0.32],[0.6,0.16],[0.36,0.2]].forEach(function(p){
        ctx.beginPath(); ctx.arc(x + w*p[0], y + h*p[1], w*0.006, 0, Math.PI*2); ctx.fill();
      });
    }
    ctx.restore();
  }

  function archPath(ctx, x, y, w, h, br){
    var R = w/2;
    ctx.beginPath();
    ctx.moveTo(x, y + R);
    ctx.arc(x + R, y + R, R, Math.PI, 0);
    ctx.lineTo(x + w, y + h - br);
    ctx.arcTo(x + w, y + h, x + w - br, y + h, br);
    ctx.lineTo(x + br, y + h);
    ctx.arcTo(x, y + h, x, y + h - br, br);
    ctx.closePath();
  }

  function wrapTextC(ctx, text, cx, y, maxWidth, lineHeight){
    ctx.textAlign = "center";
    var end = wrapText(ctx, text, cx, y, maxWidth, lineHeight);
    ctx.textAlign = "left";
    return end;
  }

  // 저장 이미지 본문: 흰 카드 안의 모든 내용을 그리고, 끝난 y를 돌려줌 (1차 측정 / 2차 실제 그리기 공용)
  function drawCardContent(ctx, opts){
    var s = opts.s, type = opts.type, compat = opts.compat, name = opts.name;
    var summary = opts.summary || {level:"mild", burnoutSum:0, typeKey:"EA"};
    var tk = summary.typeKey, T = TYPE_THEME[tk], CT = TYPE_THEME[TYPES[tk].compatKey];
    var cardX = opts.cardX, cardW = opts.cardW;
    var padX = cardX + 64, maxW = cardW - 128;
    var midX = cardX + cardW/2;
    var levelNames = LANG === "en"
      ? {mild:"Mild", moderate:"Moderate", severe:"High"}
      : {mild:"낮음", moderate:"중간", severe:"높음"};
    var levelText = LANG === "en"
      ? {mild:"This is a good time to start building a recovery routine that fits your pace.",
         moderate:"Try to conserve your energy and reduce commitments and stimulation while you recover.",
         severe:"Prioritize rest and basic self-care over performance right now."}
      : {mild:"지금부터 나에게 맞는 회복 루틴을 만들어보세요.",
         moderate:"에너지를 아끼고 일정과 자극을 줄여 회복해보세요.",
         severe:"지금은 성과보다 휴식과 기본적인 돌봄을 우선해요."};
    var recs = (RECOVERY_ACTIVITIES[summary.level] && RECOVERY_ACTIVITIES[summary.level][tk])
      ? RECOVERY_ACTIVITIES[summary.level][tk][LANG]
      : type.activities;

    // ---- 1) 아치 창: 캐릭터 + 이름 + 유형 ----
    var archX = cardX + 36, archW = cardW - 72, archY = opts.startY + 36;
    var charR = 132, charCY = archY + 300;
    ctx.font = "400 28px 'Gowun Dodum', sans-serif";
    var descLines = countWrapLines(ctx, type.desc, archW - 150);
    var prefixY = charCY + charR*1.05 + 78;
    var nameY = prefixY + 104;
    var descY = nameY + 62;
    var archH = (descY + (descLines-1)*40 + 52) - archY;

    archPath(ctx, archX, archY, archW, archH, 40);
    ctx.fillStyle = T.tint; ctx.fill();
    ctx.save();
    archPath(ctx, archX, archY, archW, archH, 40); ctx.clip();
    drawMotifs(ctx, tk, archX, archY, archW, archH, midX, charCY);
    var glow = ctx.createRadialGradient(midX, charCY, 10, midX, charCY, charR*2.1);
    glow.addColorStop(0, "rgba(255,255,255,0.95)"); glow.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(midX, charCY, charR*2.1, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    // 안쪽 점선 테두리
    ctx.save();
    ctx.setLineDash([2, 14]); ctx.lineCap = "round"; ctx.lineWidth = 5; ctx.strokeStyle = "rgba(255,255,255,0.95)";
    archPath(ctx, archX + 18, archY + 18, archW - 36, archH - 36, 26); ctx.stroke();
    ctx.restore();

    // 바닥 그림자 + 캐릭터
    ctx.fillStyle = "rgba(31,51,38,0.12)";
    ctx.beginPath(); ctx.ellipse(midX, charCY + charR*1.12, charR*0.8, charR*0.12, 0, 0, Math.PI*2); ctx.fill();
    drawCharacterIcon(ctx, midX, charCY, charR, tk, summary.level);

    ctx.textAlign = "center";
    ctx.fillStyle = "#5a6a5a";
    ctx.font = "400 30px 'Gowun Dodum', sans-serif";
    ctx.fillText(s.imageNamePrefix(name), midX, prefixY);
    ctx.fillStyle = T.ink;
    ctx.font = "96px 'Jua', sans-serif";
    ctx.fillText(type.name, midX, nameY);
    ctx.fillStyle = "#4f6152";
    ctx.font = "400 28px 'Gowun Dodum', sans-serif";
    wrapTextC(ctx, type.desc, midX, descY, archW - 150, 40);

    var y = archY + archH + 64;
    ctx.textAlign = "left";

    // ---- 2) 지금 나의 스트레스 상태 ----
    var lc = LEVEL_COLOR[summary.level] || LEVEL_COLOR.mild;
    ctx.font = "400 26px 'Gowun Dodum', sans-serif";
    var lvLines = countWrapLines(ctx, levelText[summary.level], maxW - 64);
    var boxH = 214 + lvLines*36;
    ctx.fillStyle = "#f6f5ea";
    roundedRect(ctx, padX, y, maxW, boxH, 30); ctx.fill();
    ctx.fillStyle = "#6c7a6a";
    ctx.font = "28px 'Jua', sans-serif";
    ctx.fillText(LANG === "en" ? "Your stress right now" : "지금 나의 스트레스 상태", padX + 32, y + 56);
    ctx.fillStyle = lc;
    ctx.font = "56px 'Jua', sans-serif";
    ctx.fillText(LANG === "en" ? (levelNames[summary.level] + " stress signs") : ("스트레스 신호 " + levelNames[summary.level]), padX + 32, y + 124);
    ctx.textAlign = "right";
    ctx.fillStyle = "#4f6152";
    ctx.font = "34px 'Jua', sans-serif";
    ctx.fillText(summary.burnoutSum + " / 40", padX + maxW - 32, y + 122);
    ctx.textAlign = "left";
    // 점수 막대
    var mX = padX + 32, mW = maxW - 64, mY = y + 148;
    ctx.fillStyle = "#e3e5d3"; roundedRect(ctx, mX, mY, mW, 16, 8); ctx.fill();
    var fw = Math.max(16, mW * Math.min(1, summary.burnoutSum/40));
    ctx.fillStyle = lc; roundedRect(ctx, mX, mY, fw, 16, 8); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(mX + fw - 8, mY + 8, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#4f6152";
    ctx.font = "400 26px 'Gowun Dodum', sans-serif";
    wrapText(ctx, levelText[summary.level], padX + 32, y + 206, maxW - 64, 36);
    y += boxH + 72;

    // ---- 3) 나에게 맞는 회복 활동 ----
    ctx.fillStyle = "#1f3326";
    ctx.font = "38px 'Jua', sans-serif";
    ctx.fillText(LANG === "en" ? "Recovery activities for you" : "나에게 맞는 회복 활동", padX, y);
    y += 30;
    recs.slice(0,3).forEach(function(a){
      ctx.font = "400 26px 'Gowun Dodum', sans-serif";
      var tl = countWrapLines(ctx, a[1], maxW - 128);
      var rowH = 96 + tl*36;
      ctx.fillStyle = "#f6f5ea";
      roundedRect(ctx, padX, y, maxW, rowH, 26); ctx.fill();
      // 잎 표시
      ctx.fillStyle = T.tint;
      ctx.beginPath(); ctx.arc(padX + 52, y + 52, 26, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = T.deep;
      leafPath(ctx, padX + 40, y + 62, 26, 11, -Math.PI/4); ctx.fill();
      // 활동 분류 + 내용
      ctx.fillStyle = T.ink;
      ctx.font = "28px 'Jua', sans-serif";
      ctx.fillText(a[0], padX + 98, y + 60);
      ctx.fillStyle = "#33443a";
      ctx.font = "400 26px 'Gowun Dodum', sans-serif";
      wrapText(ctx, a[1], padX + 98, y + 104, maxW - 128, 36);
      y += rowH + 14;
    });
    y += 52;

    // ---- 4) 케미가 잘 맞는 유형 ----
    ctx.font = "400 26px 'Gowun Dodum', sans-serif";
    var cdLines = countWrapLines(ctx, type.compatDesc, maxW - 64);
    var cBoxH = 214 + cdLines*36 + 12;
    ctx.fillStyle = CT.tint;
    roundedRect(ctx, padX, y, maxW, cBoxH, 30); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.beginPath(); ctx.arc(padX + 112, y + 104, 74, 0, Math.PI*2); ctx.fill();
    drawCharacterIcon(ctx, padX + 112, y + 104, 50, TYPES[tk].compatKey, "mild");
    ctx.fillStyle = "#5a6a5a";
    ctx.font = "28px 'Jua', sans-serif";
    ctx.fillText(LANG === "en" ? "Your best chemistry match" : "케미가 잘 맞는 유형", padX + 214, y + 82);
    ctx.fillStyle = CT.ink;
    ctx.font = "56px 'Jua', sans-serif";
    ctx.fillText(compat.name, padX + 214, y + 148);
    ctx.fillStyle = "#33443a";
    ctx.font = "400 26px 'Gowun Dodum', sans-serif";
    wrapText(ctx, type.compatDesc, padX + 32, y + 224, maxW - 64, 36);
    y += cBoxH + 48;

    ctx.fillStyle = "#8a9686";
    ctx.font = "400 22px 'Gowun Dodum', sans-serif";
    var disclaimer = LANG === "en"
      ? "Self-check for reflection only; not a clinical diagnosis."
      : "자가 점검 및 자기돌봄 참고용이며 전문적 진단을 대체하지 않습니다.";
    y = wrapTextC(ctx, disclaimer, midX, y, maxW, 30);
    return y;
  }

  function buildShareImage(typeKey, name){
    var s = t();
    var type = TYPES[typeKey][LANG];
    var compat = TYPES[TYPES[typeKey].compatKey][LANG];
    var T = TYPE_THEME[typeKey];
    var W = 1080;
    var cardX = 56, cardW = W - 112, cardY = 176;
    var bottomPad = 24, footerSpace = 150;

    var fontsReady = (document.fonts && document.fonts.load)
      ? Promise.all([
          document.fonts.load("400 30px 'Gowun Dodum'"),
          document.fonts.load("400 30px 'Jua'"),
          document.fonts.ready
        ]).catch(function(){ return Promise.resolve(); })
      : Promise.resolve();

    return fontsReady.then(function(){
      // ---- 1차: 실제 내용 길이를 재기 위한 임시 캔버스 ----
      var scratch = document.createElement("canvas");
      scratch.width = W; scratch.height = 4200;
      var mctx = scratch.getContext("2d");
      var endY = drawCardContent(mctx, {
        startY: cardY, cardX: cardX, cardW: cardW,
        s: s, type: type, compat: compat, name: name, summary: lastSummaryParts
      });
      var cardH = endY - cardY + bottomPad;
      var H = cardY + cardH + footerSpace;
      if (H < 1350) H = 1350;

      // ---- 2차: 정확한 크기로 실제 캔버스에 그리기 ----
      var canvas = document.getElementById("share-canvas");
      canvas.width = W; canvas.height = H;
      var ctx = canvas.getContext("2d");
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, W, H);

      // 배경: 세이지 종이 + 위쪽 유형 색 노을 + 아래 언덕
      ctx.fillStyle = "#e9ecdc"; ctx.fillRect(0, 0, W, H);
      var wash = ctx.createLinearGradient(0, 0, 0, 900);
      wash.addColorStop(0, T.tint); wash.addColorStop(1, "rgba(233,236,220,0)");
      ctx.fillStyle = wash; ctx.fillRect(0, 0, W, 900);
      ctx.fillStyle = "rgba(63,110,78,0.07)";
      for (var py = 30; py < H; py += 54){
        for (var px = ((py/54)%2 ? 27 : 0); px < W; px += 54){
          ctx.beginPath(); ctx.arc(px, py, 2.4, 0, Math.PI*2); ctx.fill();
        }
      }
      ctx.fillStyle = "#cfdcbf";
      ctx.beginPath(); ctx.moveTo(0, H - 240);
      ctx.bezierCurveTo(260, H - 330, 520, H - 190, 760, H - 260);
      ctx.bezierCurveTo(900, H - 300, 1000, H - 260, W, H - 280);
      ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#b9cfa6";
      ctx.beginPath(); ctx.moveTo(0, H - 150);
      ctx.bezierCurveTo(300, H - 210, 640, H - 110, W, H - 180);
      ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();

      // 로고
      ctx.textAlign = "center";
      ctx.fillStyle = "#2a4d37";
      ctx.font = "56px 'Jua', sans-serif";
      ctx.fillText(LANG === "en" ? "Monga" : "Monga 몽가", W/2, 112);
      ctx.fillStyle = "#3f6e4e";
      leafPath(ctx, W/2 - (LANG === "en" ? 104 : 176), 92, 34, 13, -Math.PI/3); ctx.fill();
      leafPath(ctx, W/2 + (LANG === "en" ? 104 : 176), 92, 34, 13, -Math.PI*2/3); ctx.fill();

      // 흰 카드
      ctx.save();
      ctx.shadowColor = "rgba(31,51,38,0.16)"; ctx.shadowBlur = 50; ctx.shadowOffsetY = 18;
      roundedRect(ctx, cardX, cardY, cardW, cardH, 56);
      ctx.fillStyle = "#fffef9"; ctx.fill();
      ctx.restore();

      drawCardContent(ctx, {
        startY: cardY, cardX: cardX, cardW: cardW,
        s: s, type: type, compat: compat, name: name, summary: lastSummaryParts
      });

      ctx.textAlign = "center";
      ctx.fillStyle = "#2a4d37";
      ctx.font = "400 27px 'Gowun Dodum', sans-serif";
      ctx.fillText(s.imageFooter, W/2, H - 62);

      return new Promise(function(resolve){
        if (canvas.toBlob){ canvas.toBlob(function(blob){ resolve(blob); }, "image/png"); return; }
        // toBlob을 지원하지 않는 오래된 인앱 브라우저용
        var bin = atob(canvas.toDataURL("image/png").split(",")[1]), arr = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        resolve(new Blob([arr], { type: "image/png" }));
      });
    });
  }

  // 첫 화면 언덕 위의 몽가 4총사
  function paintCast(canvas){
    if (!canvas) return;
    var w = canvas.getBoundingClientRect().width || 440, h = 150;
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = w*dpr; canvas.height = h*dpr;
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    var u = Math.min(w/440, 1.1);
    [["IS", 0.14, 92, 27], ["ES", 0.37, 84, 30], ["EA", 0.63, 80, 33], ["IA", 0.86, 90, 28]].forEach(function(c){
      drawCharacterIcon(ctx, w*c[1], c[2], c[3]*u, c[0], "mild");
    });
  }

  var UA = navigator.userAgent || "";
  var IS_IOS = /iPhone|iPad|iPod/i.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var IS_INAPP = /KAKAOTALK|Instagram|FBAN|FBAV|NAVER\(|Line\/|DaumApps|everytimeApp|; wv\)/i.test(UA);

  // 공유 링크: SHARE_URL을 정해두면 그 주소, 아니면 지금 열린 웹 주소(파일로 열었으면 링크 없음)
  function appLink(){
    if (SHARE_URL) return SHARE_URL;
    return /^https?:/.test(location.href) ? location.href.split(/[?#]/)[0] : "";
  }

  function downloadBlob(blob, filename){
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename; a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
  }

  // ---- 저장 버튼 위에 보여줄 미리보기 이미지 + 공유용 파일 캐시 ----
  var lastPreviewUrl = null;
  var previewTimer = null;
  var lastShare = null;      // { key, blob, file }

  function shareKey(){
    if (!lastSummaryParts) return "";
    var name = (document.getElementById("name-input").value || "").trim();
    return [LANG, lastSummaryParts.typeKey, lastSummaryParts.level, lastSummaryParts.burnoutSum, name].join("|");
  }
  function makeShareEntry(key, blob){
    var file = null;
    try { file = new File([blob], "monga-result.png", { type: "image/png" }); } catch(e){}
    return { key: key, blob: blob, file: file };
  }
  function getShareEntry(){
    var key = shareKey();
    if (lastShare && lastShare.key === key) return Promise.resolve(lastShare);
    var name = (document.getElementById("name-input").value || "").trim();
    return buildShareImage(lastSummaryParts.typeKey, name).then(function(blob){
      if (!blob) throw new Error("no blob");
      lastShare = makeShareEntry(key, blob);
      return lastShare;
    });
  }

  function schedulePreviewUpdate(){
    clearTimeout(previewTimer);
    previewTimer = setTimeout(updateSharePreview, 400);
  }

  function updateSharePreview(){
    if (!lastSummaryParts) return;
    getShareEntry().then(function(entry){
      var url = URL.createObjectURL(entry.blob);
      var img = document.getElementById("share-preview");
      img.src = url;
      if (lastPreviewUrl) URL.revokeObjectURL(lastPreviewUrl);
      lastPreviewUrl = url;
    }).catch(function(){ /* 미리보기 생성 실패 - 버튼을 누를 때 다시 시도함 */ });
  }

  function canShareFile(entry){
    try { return !!(entry && entry.file && navigator.share && navigator.canShare && navigator.canShare({ files: [entry.file] })); }
    catch(e){ return false; }
  }
  // 실제 공유: 반드시 버튼 클릭과 같은 흐름에서 호출해야 함
  function shareEntry(entry){
    var s = t(), link = appLink();
    var data = { files: [entry.file], title: s.shareTitle, text: s.shareText + (link ? "\n" + link : "") };
    return navigator.share(data).then(function(){ flashStatus(shareUI().shared); })
      .catch(function(err){
        if (err && err.name === "AbortError") { flashStatus(""); return; }   // 사용자가 닫음
        openSaveSheet(entry);                                                // 그 밖의 실패 → 길게 눌러 저장
      });
  }

  document.getElementById("btn-share").addEventListener("click", function(){
    if (!lastSummaryParts) return;
    var s = t();
    // 미리 만들어 둔 파일이 있으면 기다리지 않고 바로 공유 창을 엶
    if (lastShare && lastShare.key === shareKey()){
      if (canShareFile(lastShare)) shareEntry(lastShare); else openSaveSheet(lastShare);
      return;
    }
    flashStatus(s.statusCreating);
    getShareEntry().then(function(entry){
      flashStatus("");
      // 이미지를 새로 만드느라 '누른 순간'이 지났을 수 있으므로, 시트 안의 공유 버튼으로 한 번 더 누르게 함
      openSaveSheet(entry, canShareFile(entry));
    }).catch(function(){ flashStatus(t().statusFailed); });
  });
